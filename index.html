function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => { document.getElementById("imp-text").value = ev.target.result; };
  reader.readAsText(file);
}
function previewImportCSV(){
  const errBox = document.getElementById("imp-err");
  const previewBox = document.getElementById("imp-preview");
  const confirmBtn = document.getElementById("imp-confirm-btn");
  const text = document.getElementById("imp-text").value.trim();
  errBox.style.display = "none"; confirmBtn.style.display = "none"; previewBox.innerHTML = "";
  if(!text){ errBox.style.display="block"; errBox.textContent="Tempel atau unggah data CSV terlebih dahulu."; return; }

  const rows = parseCSV(text);
  const header = rows[0].map(h=>h.toLowerCase());
  const nameIdx = header.indexOf("name");
  if(nameIdx === -1){ errBox.style.display="block"; errBox.textContent="Kolom 'name' wajib ada di header CSV."; return; }
  const idx = k => header.indexOf(k);

  const parsed = [];
  const problems = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(r.every(c=>c==="")) continue;
    const name = r[nameIdx] || "";
    if(!name){ problems.push(`Baris ${i+1}: nama kosong, dilewati.`); continue; }
    parsed.push({
      name,
      sport: idx("sport")>=0 ? r[idx("sport")] : "",
      position: idx("position")>=0 ? r[idx("position")] : "",
      gender: idx("gender")>=0 && ["L","P"].includes(r[idx("gender")]) ? r[idx("gender")] : "L",
      age: idx("age")>=0 && r[idx("age")] && !isNaN(Number(r[idx("age")])) ? Number(r[idx("age")]) : null,
      height: idx("height_cm")>=0 && r[idx("height_cm")] && !isNaN(Number(r[idx("height_cm")])) ? Number(r[idx("height_cm")]) : null,
      weight: idx("weight_kg")>=0 && r[idx("weight_kg")] && !isNaN(Number(r[idx("weight_kg")])) ? Number(r[idx("weight_kg")]) : null,
      status: idx("status")>=0 && STATUS_UI_TO_DB[r[idx("status")]] ? r[idx("status")] : "Aktif"
    });
  }
  const existingNames = new Set(loadDB(DB_KEYS.athletes).map(a=>a.name.toLowerCase()));
  const seen = new Set();
  parsed.forEach(p=>{
    const key = p.name.toLowerCase();
    if(existingNames.has(key)) problems.push(`"${p.name}" sepertinya sudah ada di data atlet.`);
    if(seen.has(key)) problems.push(`"${p.name}" duplikat di dalam file CSV.`);
    seen.add(key);
  });

  importPreviewRows = parsed;
  previewBox.innerHTML = `
    <p class="helper">${parsed.length} baris siap diimport.${problems.length ? ` ${problems.length} peringatan (lihat di bawah, baris duplikat/kosong tetap dilewati saat import).` : ""}</p>
    <div class="card-list" style="max-height:220px;overflow:auto;">
      ${parsed.map(p=>`<div class="history-row"><div class="h-left"><b>${p.name}</b><span>${p.sport||'-'} · ${p.position||'-'} · ${p.status}</span></div></div>`).join("")}
    </div>
    ${problems.length ? `<div class="err" style="display:block;margin-top:8px;">${problems.join("<br/>")}</div>` : ""}
  `;
  if(parsed.length) confirmBtn.style.display = "block";
}
async function confirmImportAthletes(){
  const errBox = document.getElementById("imp-err");
  const confirmBtn = document.getElementById("imp-confirm-btn");
  confirmBtn.disabled = true; confirmBtn.textContent = "Mengimport...";
  const existingNames = new Set(loadDB(DB_KEYS.athletes).map(a=>a.name.toLowerCase()));
  const toInsert = [];
  const seen = new Set();
  importPreviewRows.forEach(p=>{
    const key = p.name.toLowerCase();
    if(existingNames.has(key) || seen.has(key)) return; // skip duplikat, konsisten dengan preview
    seen.add(key);
    const dob = p.age ? new Date(Date.now() - p.age*365.25*86400000).toISOString().slice(0,10) : null;
    toInsert.push({
      full_name: p.name, sport: p.sport || "-", position: p.position || "-", gender: p.gender,
      date_of_birth: dob, height_cm: p.height, weight_kg: p.weight, status: STATUS_UI_TO_DB[p.status] || "active"
    });
  });
  if(toInsert.length === 0){ errBox.style.display="block"; errBox.textContent="Tidak ada baris valid untuk diimport."; confirmBtn.disabled=false; confirmBtn.textContent="Konfirmasi Import"; return; }

  const { error } = await sb.from("athletes").insert(toInsert);
  if(error){ errBox.style.display="block"; errBox.textContent="Gagal import: " + error.message; confirmBtn.disabled=false; confirmBtn.textContent="Konfirmasi Import"; return; }

  importPreviewRows = [];
  await refreshAthletes();
  closeModal(); setTab("athletes");
  showToast(`${toInsert.length} atlet berhasil diimport`);
}

function athleteOverview(a){

  const mpList = loadMasterplans().filter(m=>m.athleteId===a.id).sort((x,y)=>y.createdAt-x.createdAt);

async function deleteAthlete(athleteId, athleteName){
  if(!confirm(`Hapus atlet "${athleteName}" beserta SELURUH riwayat datanya (hasil tes, cedera, readiness, training load, goals, dll)? Tindakan ini tidak dapat dibatalkan.`)) return;
  // hapus dulu tabel yang mungkin belum ON DELETE CASCADE ke athletes,
  // baru hapus baris athletes-nya (sisanya ter-cascade otomatis lewat FK).
  await sb.from("performance_results").delete().eq("athlete_id", athleteId);
  await sb.from("assessments").delete().eq("athlete_id", athleteId);
  await sb.from("athlete_files").delete().eq("athlete_id", athleteId);
  const { error } = await sb.from("athletes").delete().eq("id", athleteId);
  if(error){ showToast("Gagal menghapus atlet: " + error.message); return; }
  await refreshAthletes();
  await refreshAssessments();
  await refreshInjuries();
  state.athleteId = null;
  setTab("athletes");
  showToast(`Atlet "${athleteName}" dan seluruh riwayatnya dihapus`);
}
async function submitLinkAthleteAccount(athleteId){
  const val = document.getElementById("link-userid").value.trim();
  const { error } = await sb.from("athletes").update({ user_id: val || null }).eq("id", athleteId);
  if(error){ showToast("Gagal menautkan akun: " + error.message); return; }
  await refreshAthletes();
  render();
  showToast(val ? "Akun berhasil ditautkan" : "Tautan akun dihapus");
}

function athletePerformanceSection(a){
  const tests = loadDB(DB_KEYS.tests);
  const all = loadDB(DB_KEYS.assessments).filter(x=>x.athleteId===a.id);
  const testsWithData = tests.filter(t=>all.some(x=>x.testId===t.id));
  if(!state.profileTestId && testsWithData.length>0) state.profileTestId = testsWithData[0].id;
  if(testsWithData.length===0) return `<div class="chart-card"><div class="chart-empty">Belum ada hasil tes untuk atlet ini.</div></div>`;

  const test = tests.find(t=>t.id===state.profileTestId);
  const rows = all.filter(x=>x.testId===state.profileTestId).sort((x,y)=>y.date-x.date); // terbaru dulu untuk tabel
  const direction = (rows.find(r=>r.scoringProfileId) && cache.scoringProfiles.find(p=>p.id===rows.find(r=>r.scoringProfileId).scoringProfileId))
    ? cache.scoringProfiles.find(p=>p.id===rows.find(r=>r.scoringProfileId).scoringProfileId).direction
    : test.direction;
  const hasAnyScore = rows.some(r=>r.score!=null);

  return `
    <div class="chart-card">
      <h3>Grafik Progres per Tes</h3>
      <div class="field" style="margin-bottom:10px;">
        <select onchange="state.profileTestId=this.value; renderMain();">
          ${testsWithData.map(t=>`<option value="${t.id}" ${t.id===state.profileTestId?"selected":""}>${t.name}</option>`).join("")}
        </select>
      </div>
      <canvas id="chart-profile" height="180"></canvas>
    </div>
    ${hasAnyScore ? `
      <div class="chart-card" style="margin-top:14px;">
        <h3>Score Trend (0-100)</h3>
        <canvas id="chart-score-trend" height="180"></canvas>
      </div>
    ` : `<div class="chart-empty" style="margin-top:14px;">Belum ada standar skor untuk tes ini — Score Trend akan muncul setelah standar dikonfigurasi Admin.</div>`}

    <h2 class="page-title" style="margin-top:16px;">Test History</h2>
    ${rows.map((r,idx)=>{
      const isPB = isPersonalBest(rows, idx, direction);
      return `
        <div class="history-row">
          <div class="h-left">
            <b>${new Date(r.date).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})} ${isPB?'<span class="badge" style="background:#1D9E75;margin-left:4px;">PB</span>':''}</b>
            <span>Result: ${r.rawScore} ${test.unit}${r.score!=null?` · Score: ${r.score}/100`:' · Belum ada skor'}</span>
          </div>
          ${r.category ? `<span class="badge" style="background:${catColor(r.category)}">${r.category}</span>` : ""}
        </div>
      `;
    }).join("")}
  `;
}

function athleteImprovementSection(a){
  const tests = loadDB(DB_KEYS.tests);
  const all = loadDB(DB_KEYS.assessments).filter(x=>x.athleteId===a.id);
  const testsWithData = tests.filter(t=>all.filter(x=>x.testId===t.id).length>=2);
  if(!state.baTestId && testsWithData.length>0) state.baTestId = testsWithData[0].id;
  if(testsWithData.length===0) return `<div class="chart-card"><div class="chart-empty">Butuh minimal 2 hasil tes pada kategori yang sama untuk membandingkan Before vs After.</div></div>`;

  const test = tests.find(t=>t.id===state.baTestId);
  const rows = all.filter(x=>x.testId===test.id).sort((a,b)=>a.date-b.date);
  const before = rows[0], after = rows[rows.length-1];
  const {diff, pct} = computeImprovement(test, before.rawScore, after.rawScore);
  const improving = pct >= 0;

  return `
    <div class="field" style="margin-bottom:12px;">
      <select onchange="state.baTestId=this.value; renderMain();">
        ${testsWithData.map(t=>`<option value="${t.id}" ${t.id===state.baTestId?"selected":""}>${t.name}</option>`).join("")}
      </select>
    </div>
    <div class="before-after">
      <div class="ba-card"><div class="k">Before</div><div class="v">${before.rawScore}</div></div>
      <div class="ba-card"><div class="k">After</div><div class="v">${after.rawScore}</div></div>
      <div class="ba-card ${improving?'improve':'decline'}"><div class="k">Improvement</div><div class="v">${improving?'+':''}${pct.toFixed(1)}%</div></div>
    </div>
    ${!improving ? `<div class="err" style="margin-bottom:12px;">⚠ Performa menurun dibanding tes pertama.</div>` : ""}
    <div class="chart-card">
      <h3>Grafik Perkembangan (Assessment 1 → ${rows.length})</h3>
      <canvas id="chart-improvement" height="180"></canvas>
    </div>
  `;
}
function drawImprovementChart(){
  destroyChart("chart-improvement");
  const canvas = document.getElementById("chart-improvement"); if(!canvas) return;
  const tests = loadDB(DB_KEYS.tests); const test = tests.find(t=>t.id===state.baTestId); if(!test) return;
  const rows = loadDB(DB_KEYS.assessments).filter(a=>a.athleteId===state.athleteId && a.testId===test.id).sort((a,b)=>a.date-b.date);
  const labels = rows.map((a,i)=>`Tes ${i+1}`);
  const data = rows.map(a=>a.rawScore);
  chartInstances["chart-improvement"] = new Chart(canvas, {
    type:"line",
    data:{ labels, datasets:[{ label:`${test.name}`, data, borderColor:"#159A94", backgroundColor:"rgba(21,154,148,0.1)", pointRadius:5, tension:0.2, fill:true }] },
    options:{ responsive:true, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(ctx)=>{
      const idx = ctx.dataIndex; const val = ctx.raw; const prev = idx>0 ? data[idx-1] : null;
      if(prev===null) return `Skor: ${val} ${test.unit}`;
      const {pct} = computeImprovement(test, prev, val);
      return [`Skor: ${val} ${test.unit}`, `Sebelumnya: ${prev} ${test.unit}`, `Perubahan: ${pct>=0?'+':''}${pct.toFixed(1)}%`];
    } } } }, scales:{ y:{ticks:{font:{size:10}}}, x:{ticks:{font:{size:10}}} } }
  });
}

let pendingInjuryPhoto = null;
function handleInjuryPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  resizeImage(file, 400, (dataUrl) => { pendingInjuryPhoto = dataUrl; showToast("Foto siap disimpan"); });
}
function deriveBodySide(key){
  if(key.endsWith("_l") || key.endsWith("_lb")) return "left";
  if(key.endsWith("_r") || key.endsWith("_rb")) return "right";
  return "center";
}
async function submitInjury(athleteId){
  const type = document.getElementById("inj-type").value.trim();
  if(!type){ showToast("Isi jenis cedera terlebih dahulu"); return; }

  const bp = cache.bodyParts.find(p => p.map_key === state.selectedPart && p.anatomy_view === state.bodyView);
  if(!bp){ showToast("Bagian tubuh tidak dikenali, coba pilih ulang."); return; }

  const severity = document.getElementById("inj-severity").value;
  const status = document.getElementById("inj-status").value;
  const dateVal = document.getElementById("inj-date").value;
  const notes = document.getElementById("inj-notes").value.trim();
  const diagnosis = document.getElementById("inj-diagnosis").value.trim();
  const mechanism = document.getElementById("inj-mechanism").value.trim();
  const recoveryVal = document.getElementById("inj-recovery").value;
  const medicalNotes = document.getElementById("inj-medicalnotes").value.trim();

  const { data: row, error } = await sb.from("injuries").insert({
    athlete_id: athleteId, body_part_id: bp.id, body_side: deriveBodySide(state.selectedPart),
    injury_type: type, severity: SEVERITY_UI_TO_DB[severity], status: INJSTATUS_UI_TO_DB[status],
    injury_date: dateVal, notes,
    diagnosis: diagnosis || null, mechanism: mechanism || null,
    estimated_recovery_date: recoveryVal || null, medical_notes: medicalNotes || null,
    clearance_status: "pending"
  }).select().single();

  if(error){ showToast("Gagal menyimpan: " + error.message); return; }

  if(pendingInjuryPhoto){
    const blob = dataUrlToBlob(pendingInjuryPhoto);
    const uploaded = await uploadPhoto(athleteId, "injury", blob, "injury.jpg");
    if(uploaded){
      await sb.from("athlete_files").insert({
        athlete_id: athleteId, file_name: `injury-${bp.name}-${dateVal}.jpg`,
        file_type: "image/jpeg", category: "injury", storage_provider: "supabase",
        storage_path: uploaded.path
      });
    }
  }

  pendingInjuryPhoto = null; state.selectedPart = null;
  await refreshInjuries();
  showToast("Cedera tersimpan"); render();
}

function injuryHistoryTable(injuries){
  let rows = injuries;
  if(state.filters.part) rows = rows.filter(i=>i.bodyPartLabel===state.filters.part);
  if(state.filters.severity) rows = rows.filter(i=>i.severity===state.filters.severity);
  if(state.filters.status) rows = rows.filter(i=>i.status===state.filters.status);
  rows = rows.sort((a,b)=>b.date-a.date);
  if(rows.length===0) return `<div class="chart-empty">Tidak ada catatan cedera.</div>`;
  return rows.map(i => `
    <div class="injury-row" style="cursor:pointer;" onclick="openModal('injuryDetail','${i.id}')">
      <div class="injury-row-top">
        <b>${i.bodyPartLabel} · ${i.injuryType}</b>
        <span class="badge" style="background:${statusColor(i.status)}">${i.status}</span>
      </div>
      <div class="injury-row-meta">${new Date(i.date).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})} · <span style="color:${severityColor(i.severity)};font-weight:600;">${i.severity}</span></div>
      ${i.notes ? `<div class="injury-row-notes">${i.notes}</div>` : ""}
    </div>
  `).join("");
}

/* ---------------- INJURY DETAIL / REHAB / RETURN TO PLAY ---------------- */

  const logs = loadDB(DB_KEYS.rehabLogs).filter(r=>r.injuryId===injuryId).sort((a,b)=>a.date-b.date);
  const timeline = [
    { date:i.date, label:`Cedera dicatat — ${i.injuryType}`, kind:"injury" },
    ...logs.map(l=>({ date:l.date, label:`${l.phase} — ${l.exercises || 'Sesi rehab'}`, kind:"rehab" }))

  return `

    </div>
    ${i.diagnosis ? `<p class="helper" style="margin:10px 0 0;"><b>Diagnosis:</b> ${i.diagnosis}</p>` : ""}
    ${i.notes ? `<p class="helper" style="margin:4px 0 0;"><b>Catatan:</b> ${i.notes}</p>` : ""}
    ${i.medicalNotes ? `<p class="helper" style="margin:4px 0 0;"><b>Catatan medis:</b> ${i.medicalNotes}</p>` : ""}

      <div class="field"><label>Status</label>
        <select id="idet-status" onchange="submitUpdateInjuryStatus('${i.id}', this.value)">

}

/* ---------------- TRAINING LOAD ---------------- */
function changeLoadPeriod(p){ state.loadPeriod = p; render(); }
function athleteLoadSection(a){
  const day = 86400000;
  const now = Date.now();
  const period = state.loadPeriod || 7;
  const rows = loadDB(DB_KEYS.loads).filter(x=>x.athleteId===a.id).sort((x,y)=>y.date-x.date);

  const { acuteLoad, chronicWeeklyAvg, ratio, sufficient } = computeACWR(rows, now);
  const zone = acwrZone(ratio);
  const trend = loadTrend(rows, now);
  const strengthTrend = strengthVolumeTrend(rows, now);
  const strengthNow = strengthStatsInRange(rows, now-6*day, now);
  const strengthPrev = strengthStatsInRange(rows, now-13*day, now-7*day);
  const freq = trainingFrequency(rows, now-6*day, now);

  const readinessRows = loadDB(DB_KEYS.readiness).filter(x=>x.athleteId===a.id).sort((x,y)=>y.date-x.date);
  const latestReadiness = readinessRows[0] || null;
  const recoveryScore = latestReadiness ? latestReadiness.score : null;
  const recStatus = recoveryStatus(recoveryScore);

  const primaryRec = ACWR_RECOMMENDATIONS[zone.tag] || null;
  const elevated = ["CAUTION","HIGH","VERY HIGH","EXTREME"].includes(zone.tag);
  let combinedNote = null;
  if(elevated && recoveryScore!=null){
    combinedNote = (recStatus.label==="Poor" || recStatus.label==="Very Poor")
      ? "High workload combined with reduced recovery. Consider reducing training stress and review the next session."
      : "Workload is elevated, while current recovery indicators remain favorable. Continue monitoring.";
  }
  const strengthRec = strengthSpecificRecommendation(strengthTrend, strengthNow.avgRpe, strengthPrev.avgRpe, strengthNow.avgIntensity, recStatus.label);

  const rangeRows = rows.filter(r=>r.date >= now - (period-1)*day);
  const freqOrder = ["COMBAT","STRENGTH","CONDITIONING","SAQ","RECOVERY","OTHER"];

  return `
    <div class="section-tabs">
      ${[7,28,30].map(p=>`<button class="${period===p?'active':''}" onclick="changeLoadPeriod(${p})">${p} HARI</button>`).join("")}
    </div>

    <h2 class="page-title">Training Load</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">ACUTE LOAD</div><div class="value">${Math.round(acuteLoad)}</div><div class="helper">AU · Last 7 Days</div></div>
      <div class="stat-card"><div class="label">CHRONIC LOAD</div><div class="value">${sufficient ? Math.round(chronicWeeklyAvg) : '-'}</div><div class="helper">${sufficient ? '28-Day Baseline (AU/wk)' : 'Insufficient baseline data'}</div></div>
      <div class="stat-card"><div class="label">ACWR</div><div class="value" style="color:${zone.color}">${ratio!=null?ratio.toFixed(2):'-'}</div><div class="helper" style="color:${zone.color};font-weight:700;">${zone.tag}</div></div>
      <div class="stat-card"><div class="label">LOAD TREND</div><div class="value">${trend.pct!=null ? (trend.pct>=0?'↑':'↓')+' '+Math.abs(trend.pct).toFixed(0)+'%' : '-'}</div><div class="helper">${trend.status}</div></div>
    </div>
    ${!sufficient ? `<div class="helper" style="margin:6px 0 4px;">Continue recording training sessions to establish a reliable chronic workload baseline.</div>` : ""}
    <div class="helper" style="margin:6px 0 14px;font-style:italic;">ACWR is a workload monitoring metric and should not be used as a standalone injury-risk or medical diagnostic tool. Interpret alongside training history, recovery, performance, training phase and coach assessment.</div>

    ${isStaff() ? `<button class="btn" onclick="openTrainingSessionModal('${a.id}')">+ Catat Sesi Latihan</button>` : ""}

  if(!confirm("Hapus sesi latihan ini? Beban latihan (ACWR, load trend, dsb) akan dihitung ulang otomatis tanpa data ini. Tindakan tidak dapat dibatalkan.")) return;

}
function drawLoadChart(){
  destroyChart("chart-load");
  const canvas = document.getElementById("chart-load"); if(!canvas) return;
  const day = 86400000;
  const now = Date.now();
  const period = state.loadPeriod || 7;
  const rows = loadDB(DB_KEYS.loads).filter(x=>x.athleteId===state.athleteId && x.date>=now-(period-1)*day).sort((a,b)=>a.date-b.date);
  if(rows.length===0) return;
  const labels = rows.map(r=>new Date(r.date).toLocaleDateString("id-ID",{day:"2-digit",month:"short"}));
  const data = rows.map(r=>Math.round(r.load));
  chartInstances["chart-load"] = new Chart(canvas, {
    type:"bar",
    data:{ labels, datasets:[{ label:"Session Load (AU)", data, backgroundColor:"#20B2AA" }] },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ticks:{font:{size:10}}}, x:{ticks:{font:{size:10}}} } }
  });
}

async function submitTrainingSession(){
  const errBox = document.getElementById("tl-err");
  const d = tlDraft;
  const duration = Number(d.duration);
  const rpe = d.rpe===""? null : Number(d.rpe);
  if(!d.date || !d.type){ errBox.style.display="block"; errBox.textContent="Pilih tanggal dan jenis latihan."; return; }
  if(!duration || duration<1 || duration>300){ errBox.style.display="block"; errBox.textContent="Durasi harus antara 1-300 menit. Session load tidak dapat dihitung."; return; }
  if(rpe==null || rpe<0 || rpe>10){ errBox.style.display="block"; errBox.textContent="Session RPE harus antara 0-10. Session load tidak dapat dihitung."; return; }
  errBox.style.display="none";

  let strengthPayload = null;
  if(isStrengthCategory(d.type) && d.rows.length){
    const cleanRows = [];
    for(const r of d.rows){
      if(!r.exercise || r.sets==="" || r.reps==="" || r.load==="") continue;
      const sets = Number(r.sets), reps = Number(r.reps), load = Number(r.load);
      if(sets<1||sets>100||reps<1||reps>100||load<0||load>1000){
        errBox.style.display="block"; errBox.textContent = `Data exercise "${r.exercise}" di luar rentang valid (sets/reps 1-100, load 0-1000 kg).`; return;
      }
      const pct1rm = r.pct1rm===""?null:Number(r.pct1rm);
      if(pct1rm!=null && (pct1rm<0||pct1rm>100)){ errBox.style.display="block"; errBox.textContent="% 1RM harus antara 0-100."; return; }
      const rir = r.rir===""?null:Number(r.rir);
      if(rir!=null && (rir<0||rir>10)){ errBox.style.display="block"; errBox.textContent="RIR harus antara 0-10."; return; }
      const exerciseRpe = r.exerciseRpe===""?null:Number(r.exerciseRpe);
      cleanRows.push({ exercise:r.exercise, sets, reps, load, pct1rm, rir, exerciseRpe });
    }
    if(cleanRows.length) strengthPayload = cleanRows;
  }

  const sessionLoad = duration * rpe;
  const insertObj = {
    id: genUUID(), athlete_id: d.athleteId, session_date: d.date, session_type: d.type,
    duration_minutes: duration, session_rpe: rpe, notes: d.notes || null,
    created_by: (cache.profile && cache.profile.id) || null, updated_by: (cache.profile && cache.profile.id) || null,
    updated_at: new Date().toISOString()
  };
  if(strengthPayload) insertObj.strength_data = strengthPayload;

  const res = await cloudUpsert("training_sessions", insertObj, "trainingsession");
  if(res && res.error){
    errBox.style.display="block";
    errBox.textContent = strengthPayload
      ? "Gagal menyimpan: " + (res.error.message||res.error) + " — pastikan kolom strength_data (jsonb) sudah ditambahkan di tabel training_sessions."
      : "Gagal menyimpan: " + (res.error.message||res.error);
    return;
  }
  if(!res || !res.offline) await refreshTrainingLoad();
  else cache.loads = [mapTrainingLoadRow(insertObj), ...cache.loads];
  tlDraft = null;
  closeModal(); render();
  showToast(res && res.offline ? "Offline — Changes Saved Locally" : `Sesi tersimpan · Session Load ${sessionLoad} AU`);
}

async function submitAssessment(athleteId){
  const testId = document.getElementById("in-test").value;
  const scoreInput = document.getElementById("in-score").value;
  const errBox = document.getElementById("in-err");
  const resultBox = document.getElementById("in-result");
  if(scoreInput==="" || isNaN(Number(scoreInput))){ errBox.style.display="block"; errBox.textContent="Masukkan skor hasil tes yang valid."; return; }
  errBox.style.display="none"; resultBox.innerHTML = "";

  const test = cache.tests.find(t=>t.id===testId);
  const athlete = cache.athletes.find(a=>a.id===athleteId);
  const result = scoreResult(testId, athlete, scoreInput);

  if(!result){
    // spec #39 — tidak ada standard yang cocok untuk gender/umur atlet ini.
    // Jangan bikin skor palsu; kasih pilihan ke user.
    resultBox.innerHTML = `
      <div class="err" style="display:block;">No scoring standard available for this athlete (${athleteGenderLabel(athlete)}${ageGroupFor(athlete.age)?', '+ageGroupFor(athlete.age):''}) untuk tes "${test.name}".</div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        ${isAdmin() ? `<button class="btn ghost" style="flex:1;" onclick="closeModal(); openAdminPanel(); setAdminSection('scoring'); openModal('addScoringProfile','${testId}|${athlete.gender==='P'?'Female':'Male'}');">Configure Standard</button>` : ""}
        <button class="btn" style="flex:1;" onclick="submitAssessmentFinal('${athleteId}','${testId}', ${Number(scoreInput)}, null)">Save Result Without Score</button>
      </div>
    `;
    return;
  }
  await submitAssessmentFinal(athleteId, testId, scoreInput, result);
}
async function submitAssessmentFinal(athleteId, testId, scoreInput, result){
  const errBox = document.getElementById("in-err");
  const test = cache.tests.find(t=>t.id===testId);
  const today = new Date().toISOString().slice(0,10);

  const { data: assessRow, error: err1 } = await sb.from("assessments").insert({
    athlete_id: athleteId, assessment_name: `${test.name} - ${today}`,
    assessment_date: today, assessment_type: "periodic"
  }).select().single();
  if(err1){ errBox.style.display="block"; errBox.textContent="Gagal menyimpan: " + err1.message; return; }

  const { error: err2 } = await sb.from("performance_results").insert({

const MP_KEY = "fwj_masterplans_v1";
/* loadMasterplans()/saveMasterplans() dipertahankan dengan signature sinkron yang sama
   supaya seluruh kode UI di bawah tidak perlu diubah satu per satu. Sumber kebenaran
   sekarang cache.masterplans, yang diisi dari tabel Supabase training_masterplans
   (cross-device) lewat refreshMasterplans() saat login/refresh. localStorage tetap
   dipakai sebagai cache/fallback offline kalau Supabase belum ter-setup. */
function loadMasterplans(){
  if(cache.masterplans && cache.masterplans.length) return cache.masterplans;
  if(sb && cache.masterplans && Array.isArray(cache.masterplans)) return cache.masterplans; // cloud aktif tapi kosong
  try{ return JSON.parse(localStorage.getItem(MP_KEY)) || []; }catch(e){ return []; }
}
// list = seluruh Master Plan di memory (dipakai untuk Update UI langsung — cache.masterplans
// adalah single source of truth di sisi klien, selalu disinkronkan dari/ke Supabase).
// statusKey = id badge Saving/Saved/Failed opsional (lihat saveStatusBadge()) untuk form yang memanggil.
// changedId = kalau diisi, HANYA masterplan dengan id itu yang di-push ke Supabase (bukan seluruh list) —
// dipakai supaya autosave per-field tidak mengirim ulang seluruh master plan lain yang tidak berubah.
function saveMasterplans(list, statusKey, changedId){
  cache.masterplans = list;                                        // 1) Update UI (semua pembaca UI pakai cache.masterplans)
  try{ localStorage.setItem(MP_KEY, JSON.stringify(list)); }catch(e){} // cache offline ringan (fallback lama, bukan sumber utama)
  idbPut(IDB_STORE_CACHE, { key:"masterplans", value:list }).catch(()=>{}); // offline-first mirror di IndexedDB
  const targets = changedId ? list.filter(m=>m.id===changedId) : list;
  targets.forEach(mp=>syncOneMasterplanToCloud(mp, statusKey || `mp-${mp.id}`)); // 2) Save to Supabase (+status) → 3) update cache → 4) confirm
  return targets;
}
// Push satu Master Plan ke Supabase (Single Source of Truth), lalu konfirmasi ke cache lokal.
async function syncOneMasterplanToCloud(mp, statusKey){
  if(!mp) return { skipped:true };
  mp.updatedAt = Date.now();
  mp.updatedBy = (cache.profile && cache.profile.id) || null;
  const row = {
    id: mp.id, athlete_id: mp.athleteId || null, plan_name: mp.name || mp.athleteName || "Master Plan",
    data: mp, updated_at: new Date().toISOString(), updated_by: mp.updatedBy
  };
  const res = await cloudUpsert("training_masterplans", row, statusKey); // Saving.../Saved ✓/Save failed — Retry
  if(res && res.ok){
    mp._serverUpdatedAt = row.updated_at; // dipakai untuk Conflict Handling (bagian 16)
    const idx = cache.masterplans.findIndex(m=>m.id===mp.id);
    if(idx>-1) cache.masterplans[idx] = mp; // 3) update local cache setelah dikonfirmasi tersimpan
  }
  return res;
}
// Dipertahankan untuk kompatibilitas: sinkron ulang SEMUA master plan (dipakai saat flush queue/manual sync).
async function syncMasterplansToCloud(list){
  for(const mp of list) await syncOneMasterplanToCloud(mp, `mp-${mp.id}`);
}

/* ---- Conflict Handling (bagian 16) ----
   Sebelum menimpa Master Plan, cek apakah updated_at di server lebih baru dari versi
   yang terakhir kita sinkronkan di perangkat ini (misalnya diubah dari device lain).
   Kalau ya, JANGAN diam-diam overwrite — tampilkan pilihan ke coach. */
async function checkMasterplanConflict(mp){
  if(!sb || !navigator.onLine) return { conflict:false };
  try{
    const { data, error } = await sb.from("training_masterplans").select("updated_at, data").eq("id", mp.id).single();
    if(error || !data) return { conflict:false };
    const knownAt = mp._serverUpdatedAt || null;
    if(knownAt && data.updated_at && new Date(data.updated_at).getTime() > new Date(knownAt).getTime()){
      return { conflict:true, serverRow:data };
    }
    return { conflict:false };
  }catch(e){ return { conflict:false }; }
}

function genId(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
// UUID v4 asli (bukan prefix seperti genId) — dipakai untuk tabel yang kolom id-nya bertipe uuid
// (mis. training_sessions), supaya insert client-side dari mode offline tetap valid di kedua tipe kolom (uuid/text).
function genUUID(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}

const PROGRESSION_MODES = [

function defaultProgressionConfig(){
  return {
    volume:{ mode:"manual", start:1000, pct:10, increment:100, waveWeeks:4, stepWeeks:3, stepIncrement:100 },
    intensity:{ mode:"manual", start:70, pct:5, increment:3, waveWeeks:4, stepWeeks:3, stepIncrement:5 }

// Menghitung deret nilai per-minggu (Volume AU atau Intensity %) berdasarkan mode progresi yang dipilih coach.
// Minggu yang ditandai Deload (mp.weeklyLoads[w].isDeload) otomatis diturunkan memakai persentase dari Deload System —
// tapi hasilnya TIDAK mengunci apa pun: coach tetap bisa mengubah angka manual di tabel preview.
function computeProgressionSeries(cfg, mp, reduceKey){
  const out = {};
  const totalWeeks = Number(mp.durationWeeks)||0;
  if(!cfg || cfg.mode==="manual"){
    for(let w=1; w<=totalWeeks; w++) out[w] = null;
    return out;
  }
  let peak = Number(cfg.start)||0;
  for(let w=1; w<=totalWeeks; w++){
    const wl = mp.weeklyLoads && mp.weeklyLoads[w];
    const isDL = !!(wl && wl.isDeload);
    let val;
    if(cfg.mode==="percentage"){
      val = (w===1) ? (Number(cfg.start)||0) : peak * (1 + (Number(cfg.pct)||0)/100);
    } else if(cfg.mode==="linear"){
      val = (Number(cfg.start)||0) + (w-1) * (Number(cfg.increment)||0);
    } else if(cfg.mode==="wave"){
      const cyc = Math.max(2, Number(cfg.waveWeeks)||4);
      const pos = (w-1) % cyc, cycNum = Math.floor((w-1)/cyc);
      const cycleGrowth = 1 + cycNum * ((Number(cfg.pct)||0)/100);
      const ramp = pos * (Number(cfg.pct)||10);
      val = (Number(cfg.start)||0) * cycleGrowth * (1 + ramp/100);
    } else if(cfg.mode==="step"){
      const stepW = Math.max(1, Number(cfg.stepWeeks)||3);
      const idx = Math.floor((w-1)/stepW);
      val = (Number(cfg.start)||0) + idx * (Number(cfg.stepIncrement)||0);
    } else {
      val = Number(cfg.start)||0;
    }
    if(!isDL) peak = val;
    if(isDL){
      const pct = Number(wl.deload ? wl.deload[reduceKey] : NaN);
      const basis = (cfg.mode==="percentage") ? peak : val;
      val = basis * (1 - ((isFinite(pct) && pct>0) ? pct : 30)/100);
    }
    out[w] = Math.round(val*10)/10;
  }
  return out;
}

function levelWeight(level){ return {"Pemula":1,"Intermediate":2,"Advanced":3,"Elite":4}[level] || 1; }

function recommendModel(input){
  const reasons = [];
  const weeks = Number(input.durationWeeks) || 0;
  const trainingAge = Number(input.trainingAge) || 0;
  const lvl = levelWeight(input.level);
  const needsSimultaneous = input.secondaryGoal && input.maintenanceGoal && input.secondaryGoal !== input.maintenanceGoal;
  let model, confidence = 65;

  if(input.level === "Pemula" || weeks <= 8){
    model = "traditional"; confidence = 78;
    reasons.push("Level pemula atau durasi program pendek paling cocok dengan progresi linear yang jelas tahap demi tahap.");
    reasons.push("Atlet membutuhkan adaptasi anatomis dasar sebelum menangani kompleksitas model lain.");
  } else if(needsSimultaneous && lvl >= 3){
    model = "nonlinear"; confidence = 74;
    reasons.push("Atlet perlu mempertahankan beberapa kualitas fisik (secondary & maintenance) secara simultan.");
    reasons.push("Level Advanced/Elite mampu mentoleransi variasi stimulus harian/mingguan tanpa kehilangan fokus adaptasi.");
  } else if(trainingAge >= 3 && lvl >= 2){
    model = "block"; confidence = 80;
    reasons.push("Training age memadai untuk fokus terkonsentrasi per blok (accumulation → transmutation → realization).");
    reasons.push("Kalender program cukup panjang untuk menjalankan sekuens blok tanpa mengorbankan kualitas lain (maintenance dose).");
  } else {
    model = "traditional"; confidence = 60;
    reasons.push("Kombinasi level dan training age saat ini paling sesuai dengan pendekatan progresif standar.");
  }
  reasons.push(`Primary goal "${input.primaryGoal}" mendukung struktur fase model ini.`);
  if(confidence < 70) reasons.push("Hybrid periodization mungkin lebih sesuai — pertimbangkan evaluasi ulang di tengah program.");
  return {model, reasons, confidence};
}

function buildPhaseWeeks(phaseTemplate, totalWeeks){
  const out = []; let cursor = 1;
  phaseTemplate.forEach((p, idx) => {
    let len = Math.max(1, Math.round(p.pct * totalWeeks));
    if(idx === phaseTemplate.length - 1) len = totalWeeks - cursor + 1;
    if(len < 1) len = 1;
    const weekStart = cursor, weekEnd = Math.min(totalWeeks, cursor + len - 1);
    out.push({
      id: genId("ph"), ...p, weekStart, weekEnd,
      // ---- field Phase Management tambahan (coach dapat mengubahnya lewat Edit Phase) ----
      phaseType: p.label, mainGoal: p.focus, secondaryGoal:"",
      frequency:"", volumeTarget: normLevel3(p.volume), intensityTarget: normLevel3(p.intensity),
      recoveryTarget:"", deloadWeek:false
    });
    cursor = weekEnd + 1;
  });
  return out.filter(p => p.weekStart <= totalWeeks);
}

function buildMesocycles(phases, model){
  const meso = [];
  phases.forEach((ph, i) => {
    const totalLen = ph.weekEnd - ph.weekStart + 1;
    let cursor = ph.weekStart, blockNum = 1;
    while(cursor <= ph.weekEnd){
      const len = Math.min(4, ph.weekEnd - cursor + 1);
      const wEnd = cursor + len - 1;
      const isDeload = len >= 4;
      meso.push({
        id: genId("meso"), phaseLabel: ph.label, blockLabel: `${ph.label}${totalLen>4 ? " — Blok " + blockNum : ""}`,
        weekStart: cursor, weekEnd: wEnd, volume: ph.volume, intensity: ph.intensity,
        specificity: ph.specificity, focus: ph.focus, deload: isDeload, model
      });
      cursor = wEnd + 1; blockNum++;
    }
  });
  return meso;
}

function generateMasterplanData(input){
  const durationWeeks = Number(input.durationWeeks);
  let resolvedModel = input.model, autoReasons = [], confidence = null;
  if(input.model === "auto"){
    const rec = recommendModel(input);
    resolvedModel = rec.model; autoReasons = rec.reasons; confidence = rec.confidence;
  } else {
    autoReasons = [`Model dipilih manual oleh pelatih: ${MODEL_LABEL[input.model]}.`];
  }

  let phases;
  if(resolvedModel === "traditional") phases = buildPhaseWeeks(TRADITIONAL_PHASES, durationWeeks);
  else if(resolvedModel === "block") phases = buildPhaseWeeks(BLOCK_PHASES, durationWeeks);
  else phases = buildPhaseWeeks([
    {label:"Undulating Cycle", pct:1, volume:"Bergelombang", intensity:"Bergelombang", specificity:"Meningkat", focus:"Hypertrophy ↔ Strength ↔ Power ↔ Speed (rotasi harian/mingguan)"}
  ], durationWeeks);

  const mesocycles = buildMesocycles(phases, resolvedModel);

  return {
    id: genId("mp"),
    name: input.name || `${input.athleteName} — ${input.primaryGoal}`,
    athleteId: input.athleteId, athleteName: input.athleteName,
    sport: input.sport, level: input.level, trainingAge: input.trainingAge,
    competitionLevel: input.competitionLevel || "",
    startDate: input.startDate, durationWeeks,
    trainingDaysPerWeek: input.trainingDaysPerWeek, sessionsPerDay: input.sessionsPerDay || 1,
    primaryGoal: input.primaryGoal, secondaryGoal: input.secondaryGoal, maintenanceGoal: input.maintenanceGoal,
    competitionName: input.competitionName, competitionDate: input.competitionDate,
    modelInput: input.model, resolvedModel, confidence, reasons: autoReasons,
    phases, mesocycles, weeklyLogs: [],
    weeklyLoads: {}, // key = nomor minggu (string) -> objek Volume & Intensity minggu itu (lihat emptyWeekLoad)
    createdAt: Date.now()
  };
}
function mpEndDate(mp){
  if(!mp.startDate) return null;
  const d = new Date(mp.startDate+"T00:00:00");
  d.setDate(d.getDate() + (Number(mp.durationWeeks)||0)*7 - 1);
  return d;
}
function weekDateRange(mp, weekNum){
  if(!mp.startDate) return null;
  const start = new Date(mp.startDate+"T00:00:00");
  start.setDate(start.getDate() + (weekNum-1)*7);
  const end = new Date(start); end.setDate(end.getDate()+6);
  const fmt = d => d.toLocaleDateString("id-ID",{day:"2-digit",month:"short"});
  return `${fmt(start)} – ${fmt(end)}`;
}

function currentWeekOf(mp){
  const start = new Date(mp.startDate).getTime();
  if(isNaN(start)) return 1;
  const diffDays = Math.floor((Date.now() - start) / 86400000);
  const wk = Math.floor(diffDays / 7) + 1;
  return Math.min(mp.durationWeeks, Math.max(1, wk));
}
function mesoForWeek(mp, week){ return mp.mesocycles.find(m => week >= m.weekStart && week <= m.weekEnd); }
function phaseForWeek(mp, week){ return mp.phases.find(p => week >= p.weekStart && week <= p.weekEnd); }

async function submitPhase(mpId, phaseId){

  const label = document.getElementById("ph-label").value.trim();
  const phaseType = document.getElementById("ph-type").value;
  const weekStart = Number(document.getElementById("ph-weekstart").value);
  const weeks = Number(document.getElementById("ph-weeks").value);

  const intensityTarget = document.getElementById("ph-inttarget").value;
  const recoveryTarget = document.getElementById("ph-rectarget").value.trim();

  if(!label || !weekStart || !weeks || weeks<1){
    errBox.style.display="block"; errBox.textContent="Isi nama phase, minggu mulai, dan jumlah minggu."; return;
  }
  const weekEnd = weekStart + weeks - 1;

  const patch = {
    label, phaseType, weekStart, weekEnd, mainGoal, secondaryGoal, frequency,

    if(idx>-1) mp.phases[idx] = { ...mp.phases[idx], ...patch };
  } else {
    mp.phases.push({ id: genId("ph"), ...patch });
  }
  mp.phases.sort((a,b)=>a.weekStart-b.weekStart);
  setSaveStatus(`phase-${mpId}`, "saving");
  const ok = await saveMasterplansWithConflictCheck(list, `phase-${mpId}`, mpId);
  if(!ok) return; // konflik — modal Reload Latest/Keep Mine/Compare sudah tampil
  closeModal(); render();
  showToast("Phase tersimpan");
}

/* ---- Warning system (monitoring only) ---- */
const LEVEL3_RANK = {Low:1, Moderate:2, High:3};
function computeLoadWarnings(mp){
  const warnings = [];
  const weeks = Object.keys(mp.weeklyLoads||{}).map(Number).sort((a,b)=>a-b);
  let consecutiveHigh = 0;
  const compWeek = mp.competitionDate && mp.startDate ? Math.ceil((new Date(mp.competitionDate)-new Date(mp.startDate))/(7*86400000))+1 : null;

  weeks.forEach((wk,i) => {
    const w = mp.weeklyLoads[wk];
    const volL = normLevel3(w.volume?.level), intL = normLevel3(w.intensity?.level);

    if(volL==="High" && intL==="High"){
      warnings.push({week:wk, severity:"high", msg:`Minggu ${wk}: High Volume + High Intensity secara bersamaan. Pertimbangkan menurunkan salah satu variabel.`});
    }
    if(i>0){
      const prevWk = weeks[i-1];
      const prev = mp.weeklyLoads[prevWk];
      if(prevWk === wk-1){
        const prevVolL = normLevel3(prev.volume?.level), prevIntL = normLevel3(prev.intensity?.level);
        if(LEVEL3_RANK[volL] - LEVEL3_RANK[prevVolL] >= 2){
          warnings.push({week:wk, severity:"med", msg:`Minggu ${wk}: Kenaikan volume yang cepat dari minggu sebelumnya (${prevVolL} → ${volL}).`});
        }
        if(LEVEL3_RANK[intL] - LEVEL3_RANK[prevIntL] >= 2){
          warnings.push({week:wk, severity:"med", msg:`Minggu ${wk}: Kenaikan intensity yang cepat dari minggu sebelumnya (${prevIntL} → ${intL}).`});
        }
      }
    }
    if(volL==="High" || intL==="High") consecutiveHigh++; else consecutiveHigh=0;
    if(consecutiveHigh===3){
      warnings.push({week:wk, severity:"high", msg:`Training load tinggi selama 3 minggu berturut-turut (hingga Minggu ${wk}). Pertimbangkan deload/recovery week.`});
    }
    if(compWeek && !w.isDeload){
      const weeksToComp = compWeek - wk;
      if(weeksToComp>=0 && weeksToComp<=1 && volL==="High"){
        warnings.push({week:wk, severity:"high", msg:`Minggu ${wk}: Volume masih High padahal kompetisi ${weeksToComp===0?'minggu ini':'minggu depan'} — belum ada recovery/taper.`});
      }
    }
  });
  return { warnings: warnings.slice(-8).reverse(), disclaimer:"Peringatan ini hanya untuk monitoring beban latihan, bukan diagnosis medis atau prediksi cedera. Selalu pertimbangkan bersama riwayat latihan, recovery, dan penilaian pelatih." };
}

    },

}
async function submitWeekLoad(mpId, week){
  const errBox = document.getElementById("wl-err");
  const list = loadMasterplans();
  const mp = list.find(m=>m.id===mpId); if(!mp) return;
  mp.weeklyLoads = mp.weeklyLoads || {};
  const existing = mp.weeklyLoads[week] || emptyWeekLoad(week);
  const w = readWeekLoadForm(week, existing);
  if(!w.volume.level || !w.intensity.level){
    errBox.style.display="block"; errBox.textContent="Pilih Volume Level dan Intensity Level."; return;
  }
  mp.weeklyLoads[week] = w;
  setSaveStatus(`weekload-${week}`, "saving");
  const ok = await saveMasterplansWithConflictCheck(list, `weekload-${week}`, mpId);
  if(!ok) return;
  closeModal(); render();
  showToast(`Volume & Intensity Minggu ${week} tersimpan`);
}
// Auto Save (bagian 12): dipanggil lewat event delegation setiap field wl-* berubah.
// Debounce ±800ms supaya tidak request Supabase pada tiap karakter yang diketik.
const _wlAutosaveDebounced = {};
function scheduleWeekLoadAutosave(mpId, week){
  const key = `${mpId}:${week}`;
  if(!document.getElementById("wl-err")) return; // modal sudah tertutup
  if(!_wlAutosaveDebounced[key]) _wlAutosaveDebounced[key] = debounce(()=>silentSaveWeekLoad(mpId, week), 800);
  setSaveStatus(`weekload-${week}`, "saving");
  _wlAutosaveDebounced[key]();
}
function silentSaveWeekLoad(mpId, week){
  if(!document.getElementById("wl-err")) return; // modal sudah ditutup sebelum debounce selesai
  const list = loadMasterplans();
  const mp = list.find(m=>m.id===mpId); if(!mp) return;
  mp.weeklyLoads = mp.weeklyLoads || {};
  const existing = mp.weeklyLoads[week] || emptyWeekLoad(week);
  const w = readWeekLoadForm(week, existing);
  mp.weeklyLoads[week] = w;
  saveMasterplans(list, `weekload-${week}`, mpId); // autosave tidak memicu Conflict Handling (hanya klik Simpan yang cek konflik)
}

/* ==========================================================
   DAILY TRAINING PLANNER
   Menggunakan struktur Master Plan yang sudah ada (mp.dailyPlans,
   disimpan di object masterplan yang sama di localStorage) —
   tidak membuat sistem database terpisah.
========================================================== */
const DP_BLOCK_CATEGORIES = ["Warm Up","Strength","Conditioning","Combat","Other"];
const DP_COMBAT_TYPES = ["Muay Thai","Kickboxing","Sparring","Pad Work","Heavy Bag","Technical Training"];
function todayISO(){ return new Date().toISOString().slice(0,10); }
function dpFmtDate(dateStr){ return new Date(dateStr+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long", day:"2-digit", month:"short"}); }
function dpDayName(dateStr){ return new Date(dateStr+"T00:00:00").toLocaleDateString("id-ID",{weekday:"short"}); }
function mondayOf(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay(); // 0=Minggu
  const diff = (day===0 ? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function addDaysISO(dateStr, n){
  const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function weekDatesFrom(mondayStr){ return Array.from({length:7}, (_,i)=>addDaysISO(mondayStr, i)); }
function emptyDpExercise(){
  return { id: genId("ex"), name:"", category:"", sets:"", reps:"", duration:"", distance:"",
    load:"", pct1rm:"", rpeTarget:"", rirTarget:"", rest:"", tempo:"", notes:"", completed:false,
    rounds:"", roundDuration:"", restDuration:"", trainingType:"", intensity:"" };
}
function emptyDpBlock(category){ return { id: genId("blk"), category, exercises: [] }; }
function emptyDailyPlan(dateStr){
  return {
    date: dateStr, title:"", isRestDay:false,
    blocks: DP_BLOCK_CATEGORIES.map(c=>emptyDpBlock(c)),
    status:"planned", completedAt:null, actualDuration:null, actualRPE:null, notes:""
  };
}
function getDailyPlan(mp, dateStr){ return (mp.dailyPlans && mp.dailyPlans[dateStr]) || null; }
function saveDailyPlan(mpId, plan, statusKey){
  const list = loadMasterplans();
  const mp = list.find(m=>m.id===mpId); if(!mp) return;
  mp.dailyPlans = mp.dailyPlans || {};
  mp.dailyPlans[plan.date] = plan;
  saveMasterplans(list, statusKey || `dailyplan-${plan.date}`, mpId);
}
function deleteDailyPlan(mpId, dateStr){
  if(!confirm("Hapus rencana sesi untuk hari ini?")) return;
  const list = loadMasterplans();
  const mp = list.find(m=>m.id===mpId); if(!mp) return;
  if(mp.dailyPlans) delete mp.dailyPlans[dateStr];
  saveMasterplans(list);
  render();
}

function dpExerciseLine(ex, category){
  if(category==="Combat"){
    const parts = [];
    if(ex.rounds) parts.push(`${ex.rounds} × ${ex.roundDuration||'?'} min`);
    if(ex.restDuration) parts.push(`Rest ${ex.restDuration}`);
    if(ex.intensity) parts.push(`Intensity ${ex.intensity}`);
    if(ex.rpeTarget) parts.push(`RPE ${ex.rpeTarget}`);
    return `<b>${ex.name}</b>${ex.trainingType?` (${ex.trainingType})`:""}${parts.length?` — ${parts.join(" · ")}`:""}`;
  }
  const parts = [];
  if(ex.sets && ex.reps) parts.push(`${ex.sets} × ${ex.reps}`);
  else if(ex.sets && ex.duration) parts.push(`${ex.sets} × ${ex.duration}`);
  else if(ex.duration) parts.push(`${ex.duration}`);
  if(ex.distance) parts.push(`${ex.distance}`);
  if(ex.load) parts.push(`${ex.load} kg`);
  if(ex.pct1rm) parts.push(`@${ex.pct1rm}%`);
  if(ex.rest) parts.push(`rest ${ex.rest}`);
  if(ex.rpeTarget) parts.push(`RPE ${ex.rpeTarget}`);
  if(ex.rirTarget) parts.push(`RIR ${ex.rirTarget}`);
  return `<b>${ex.name}</b>${parts.length?` — ${parts.join(" · ")}`:""}`;
}

function toggleDpExerciseComplete(mpId, dateStr, blockId, exId){
  const list = loadMasterplans();

/* ---- Complete Session -> update plan + kirim data aktual ke Training Load ---- */
function openCompleteSessionModal(mpId, dateStr){
  openModal("completeSession", {mpId, date:dateStr});

function modalCompleteSession(payload){
  const list = loadMasterplans();
  const mp = list.find(m=>m.id===payload.mpId);
  const plan = mp ? getDailyPlan(mp, payload.date) : null;
  if(!plan) return `<div class="modal-head"><h3>Selesaikan Sesi</h3><button class="close-x" onclick="closeModal()">✕</button></div><p>Rencana tidak ditemukan.</p>`;
  // Estimasi awal dari planned data (durasi warm up/conditioning + rata2 RPE target)
  const allEx = plan.blocks.flatMap(b=>b.exercises);
  const rpeVals = allEx.map(e=>Number(e.rpeTarget)).filter(v=>v>0);
  const estRpe = rpeVals.length ? Math.round(rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length) : "";
  return `
    <div class="modal-head"><h3>Selesaikan Sesi</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <p class="helper">${plan.title} · ${dpFmtDate(plan.date)}</p>
    <div class="field-row">
      <div class="field"><label>Durasi Aktual (menit)</label><input id="cs-duration" type="number" min="1" max="300" placeholder="cth. 90"/></div>
      <div class="field"><label>Session RPE Aktual (0-10)</label><input id="cs-rpe" type="number" min="0" max="10" value="${estRpe}"/></div>
    </div>
    <p class="helper">Data ini akan otomatis masuk ke Training Load (Acute/Chronic Load, ACWR) atlet.</p>
    <div id="cs-err" class="err" style="display:none;"></div>
    <button class="btn" onclick="submitCompleteSession('${payload.mpId}','${payload.date}')">Simpan & Hitung Training Load</button>
    <div style="margin-top:8px;text-align:center;">${saveStatusBadge("completesession")}</div>
  `;
}
async function submitCompleteSession(mpId, dateStr){
  const errBox = document.getElementById("cs-err");
  const duration = Number(document.getElementById("cs-duration").value);
  const rpe = Number(document.getElementById("cs-rpe").value);
  if(!duration || duration<1 || duration>300){ errBox.style.display="block"; errBox.textContent="Durasi harus antara 1-300 menit."; return; }
  if(document.getElementById("cs-rpe").value==="" || rpe<0 || rpe>10){ errBox.style.display="block"; errBox.textContent="Session RPE harus antara 0-10."; return; }
  errBox.style.display="none";

  const list = loadMasterplans();
  const mp = list.find(m=>m.id===mpId); if(!mp) return;
  const plan = getDailyPlan(mp, dateStr); if(!plan) return;

  // Tentukan training_type dominan untuk dicatat di Training Load (existing training_sessions),
  // prioritas: ada blok Strength dengan exercise -> "Strength Training", ada Combat -> nama trainingType-nya,
  // kalau tidak ada -> "Other".
  const strengthBlock = plan.blocks.find(b=>b.category==="Strength" && b.exercises.length>0);
  const combatBlock = plan.blocks.find(b=>b.category==="Combat" && b.exercises.length>0);
  let sessionType = "Other";
  if(strengthBlock) sessionType = "Strength Training";
  else if(combatBlock) sessionType = combatBlock.exercises[0].trainingType || "Muay Thai";
  else {
    const condBlock = plan.blocks.find(b=>b.category==="Conditioning" && b.exercises.length>0);
    if(condBlock) sessionType = "Running";
  }

  let strengthPayload = null;
  if(strengthBlock){
    const rows = strengthBlock.exercises
      .filter(e=>e.name && e.sets && e.reps && e.load)
      .map(e=>({ exercise:e.name, sets:Number(e.sets)||0, reps:Number(e.reps)||0, load:Number(e.load)||0,
        pct1rm: e.pct1rm?Number(e.pct1rm):null, rir: e.rirTarget?Number(e.rirTarget):null, exerciseRpe: e.rpeTarget?Number(e.rpeTarget):null }));
    if(rows.length) strengthPayload = rows;
  }

  const insertObj = {
    id: genUUID(), athlete_id: mp.athleteId, session_date: dateStr, session_type: sessionType,
    duration_minutes: duration, session_rpe: rpe, notes: `Dari Daily Plan: ${plan.title}`,
    created_by: (cache.profile && cache.profile.id) || null, updated_by: (cache.profile && cache.profile.id) || null,
    updated_at: new Date().toISOString()
  };
  if(strengthPayload) insertObj.strength_data = strengthPayload;

  // cloudUpsert: Update Supabase (single source of truth) + status badge Saving/Saved/Failed;
  // kalau offline/gagal, otomatis masuk Sync Queue (IndexedDB) dan tidak hilang.
  const res = await cloudUpsert("training_sessions", insertObj, "completesession");
  if(res && res.error){
    errBox.style.display="block";
    errBox.textContent = "Gagal menyimpan ke Training Load: " + (res.error.message || res.error);
    return;
  }
  if(!res || !res.offline) await refreshTrainingLoad();
  else cache.loads = [mapTrainingLoadRow({ ...insertObj, session_date:dateStr }), ...cache.loads]; // tampil langsung walau masih offline

  plan.status = "completed"; plan.completedAt = Date.now();
  plan.actualDuration = duration; plan.actualRPE = rpe;
  plan.blocks.forEach(b=>b.exercises.forEach(e=>e.completed=true));
  saveDailyPlan(mpId, plan, "completesession");

  closeModal(); render();
  showToast(res && res.offline ? "Offline — Changes Saved Locally" : `Sesi selesai · Session Load ${duration*rpe} AU tercatat di Training Load`);
}

/* ---------------- MASTER PLAN DASHBOARD (bagian 19) ----------------
   Ringkasan cepat: Athlete, Phase, Week, Volume/Intensity bar, Training Load,
   Planned vs Actual Load, RPE, Recovery (dari Readiness terakhir), ACWR, Status. */
function mpDashboardStatus(planned, actual, zone){
  if(zone.tag==="HIGH" || zone.tag==="VERY HIGH" || zone.tag==="EXTREME") return { label:"AT RISK", color:"var(--poor)" };
  if(!planned || !planned.load) return { label:"ON TRACK", color:"var(--elite)" };
  const diffPct = (actual.load - planned.load) / planned.load * 100;
  if(diffPct > 15) return { label:"AHEAD (High Load)", color:"var(--average)" };
  if(diffPct < -20) return { label:"BEHIND", color:"var(--average)" };
  return { label:"ON TRACK", color:"var(--elite)" };
}
function mpDashboardWidget(mp, wk){
  const phase = phaseForWeek(mp, wk);
  const rows = loadDB(DB_KEYS.loads).filter(x=>x.athleteId===mp.athleteId).sort((a,b)=>a.date-b.date);
  const now = Date.now();
  const acwr = computeACWR(rows, now);
  const zone = acwrZone(acwr.ratio);
  const planned = weekPlannedStats(mp, wk);
  const actual = weekActualStats(rows, mp, wk);
  const actualRPE = weekActualRPEFromPlans(mp, wk) != null ? weekActualRPEFromPlans(mp, wk) : actual.avgRpe;

  const readinessRows = loadDB(DB_KEYS.readiness).filter(r=>r.athleteId===mp.athleteId).sort((a,b)=>b.date-a.date);
  const latestReadiness = readinessRows[0];
  const recovery = latestReadiness ? readinessCategory(computeReadinessScore(latestReadiness)) : { label:"-", color:"var(--muted)" };

  const volPct = planned.load ? Math.max(0, Math.min(150, Math.round((actual.load/planned.load)*100))) : (actual.load>0?100:0);
  const intPct = planned.intensity ? Math.max(0, Math.min(150, Math.round(((actual.avgIntensity||0)/planned.intensity)*100))) : (actual.avgIntensity||0);
  const status = mpDashboardStatus(planned, actual, zone);

  const bar = (pct, color) => {
    const filled = Math.round(Math.min(100,pct)/10);
    return `<span style="font-family:monospace;letter-spacing:1px;color:${color};">${'█'.repeat(filled)}${'░'.repeat(10-filled)}</span> ${pct}%`;
  };

  return `
    <div class="chart-card" style="border-left:4px solid var(--turquoise);">
      <h3>Master Plan Overview</h3>
      <div class="info-grid">
        <div class="info-item"><div class="k">Athlete</div><div class="v">${mp.athleteName}</div></div>
        <div class="info-item"><div class="k">Phase</div><div class="v" style="font-size:12.5px;">${phase?phase.label:'-'}</div></div>
        <div class="info-item"><div class="k">Week</div><div class="v">Week ${wk} / ${mp.durationWeeks}</div></div>
        <div class="info-item"><div class="k">Status</div><div class="v" style="color:${status.color};">${status.label}</div></div>
      </div>
      <div style="margin-top:6px;">
        <div class="helper" style="margin-bottom:2px;">Volume (Actual/Planned)</div>
        <div>${bar(volPct, "var(--turquoise-dark)")}</div>
      </div>
      <div style="margin-top:10px;">
        <div class="helper" style="margin-bottom:2px;">Intensity (Actual/Planned)</div>
        <div>${bar(intPct, "var(--good)")}</div>
      </div>
      <div class="info-grid" style="margin-top:12px;">
        <div class="info-item"><div class="k">Training Load</div><div class="v">${Math.round(actual.load)} AU</div></div>
        <div class="info-item"><div class="k">Planned Load</div><div class="v">${planned.load!=null?planned.load+' AU':'-'}</div></div>
        <div class="info-item"><div class="k">Actual Load</div><div class="v">${Math.round(actual.load)} AU</div></div>
        <div class="info-item"><div class="k">RPE</div><div class="v">${actualRPE!=null?actualRPE:'-'}</div></div>
        <div class="info-item"><div class="k">Recovery</div><div class="v" style="color:${recovery.color};">${recovery.label}</div></div>
        <div class="info-item"><div class="k">ACWR</div><div class="v" style="color:${zone.color};">${acwr.ratio!=null?acwr.ratio.toFixed(2):'-'}</div></div>
      </div>
    </div>
  `;
}

function computeAdjustment(plannedRPE, actualRPE){
  const diff = actualRPE - plannedRPE;
  if(diff >= 2) return {status:"Fatigue Tinggi", color:"var(--poor)", rec:"Kurangi volume sesi berikutnya sekitar 15–20%. Tambahkan waktu recovery dan evaluasi tidur/soreness sebelum melanjutkan progresi."};
  if(diff === 1) return {status:"Fatigue Sedang", color:"var(--average)", rec:"Pertahankan intensity, kurangi volume accessory ±10%. Pantau recovery dalam 24 jam ke depan."};
  if(diff === 0) return {status:"Sesuai Rencana", color:"var(--good)", rec:"Tidak perlu perubahan besar. Lanjutkan progresi sesuai rencana mesocycle."};
  return {status:"Di Bawah Target", color:"var(--elite)", rec:"Performa/kesiapan lebih baik dari prediksi. Pertimbangkan sedikit penambahan beban atau volume pada sesi berikutnya."};
}

/* ==========================================================
   MASTER PLAN: AUTOMATIC TRAINING LOAD CALCULATION +
   PLANNED VS ACTUAL + ACWR INTEGRATION (section 8/9/10)
========================================================== */
function weekDateMsRange(mp, wk){
  if(!mp.startDate) return [0,-1];
  const start = new Date(mp.startDate+"T00:00:00").getTime() + (wk-1)*7*86400000;
  return [start, start + 7*86400000 - 1];
}
// Planned data — bersumber dari Volume/Intensity Mingguan (Week-to-Week Progression) & Daily Planner
function weekPlannedStats(mp, wk){
  const wl = getWeekLoad(mp, wk);
  return {
    load: wl && wl.volume.trainingLoad!=="" ? Number(wl.volume.trainingLoad)||0 : null,
    volume: wl && wl.volume.strengthVolumeLoad!=="" ? Number(wl.volume.strengthVolumeLoad)||0 : null,
    intensity: wl && wl.intensity.overallPct!=null && wl.intensity.overallPct!=="" ? Number(wl.intensity.overallPct) : null,
    rpe: weekPlannedRPE(mp, wk)
  };
}
function weekPlannedRPE(mp, wk){
  if(!mp.dailyPlans) return null;
  const [from,to] = weekDateMsRange(mp, wk);
  const vals = [];
  Object.values(mp.dailyPlans).forEach(p=>{
    if(p.isRestDay) return;
    const t = new Date(p.date+"T00:00:00").getTime();
    if(t<from || t>to) return;
    p.blocks.forEach(b=>b.exercises.forEach(e=>{ const r = Number(e.rpeTarget); if(r>0) vals.push(r); }));
  });
  return vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10 : null;
}
function weekActualRPEFromPlans(mp, wk){
  if(!mp.dailyPlans) return null;
  const [from,to] = weekDateMsRange(mp, wk);
  const vals = [];
  Object.values(mp.dailyPlans).forEach(p=>{
    const t = new Date(p.date+"T00:00:00").getTime();
    if(t<from || t>to) return;
    if(p.status==="completed" && p.actualRPE!=null) vals.push(Number(p.actualRPE));
  });
  return vals.length ? Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*10)/10 : null;
}
// Actual data — bersumber dari Training Load (training_sessions) yang sudah tercatat, termasuk hasil "Tandai Sesi Selesai"
// Session Load = Duration × Session RPE, Volume Load = Sets × Reps × Load (sudah dihitung di mapTrainingLoadRow)
function weekActualStats(rows, mp, wk){
  const [from,to] = weekDateMsRange(mp, wk);
  const wkRows = rows.filter(r=>r.date>=from && r.date<=to);
  const load = wkRows.reduce((s,r)=>s+(r.load||0),0);
  const volume = wkRows.reduce((s,r)=>s+(r.volumeLoad||0),0);
  const rpeVals = wkRows.map(r=>r.rpe).filter(v=>v>0);
  const avgRpe = rpeVals.length ? Math.round((rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length)*10)/10 : null;
  const pctVals = [];
  wkRows.forEach(r=>(r.strengthData||[]).forEach(x=>{ if(x.pct1rm!=null) pctVals.push(x.pct1rm); }));
  const avgIntensity = pctVals.length ? Math.round(pctVals.reduce((a,b)=>a+b,0)/pctVals.length) : (avgRpe!=null ? Math.round(avgRpe*10) : null);
  return { load, volume, avgRpe, avgIntensity, sessions: wkRows.length };
}

function setMpAnalysisGrain(g){ state.mpAnalysisGrain = g; render(); }

function mpAnalysisSection(mp, wk){
  const rows = loadDB(DB_KEYS.loads).filter(x=>x.athleteId===mp.athleteId).sort((a,b)=>a.date-b.date);
  const now = Date.now();
  const acwr = computeACWR(rows, now);
  const zone = acwrZone(acwr.ratio);
  const trend = loadTrend(rows, now);

  const planned = weekPlannedStats(mp, wk);
  const actual = weekActualStats(rows, mp, wk);
  const actualRPE = weekActualRPEFromPlans(mp, wk) != null ? weekActualRPEFromPlans(mp, wk) : actual.avgRpe;
  const loadWarn = planned.load && actual.load > planned.load * 1.15;

  if(!state.mpAnalysisGrain) state.mpAnalysisGrain = "week";

  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">ACWR</div><div class="value" style="color:${zone.color}">${acwr.ratio!=null?acwr.ratio.toFixed(2):'-'}</div><div class="helper" style="color:${zone.color};font-weight:700;">${zone.tag}</div></div>
      <div class="stat-card"><div class="label">Acute Load (7 hari)</div><div class="value">${Math.round(acwr.acuteLoad)}</div></div>
      <div class="stat-card"><div class="label">Chronic Load (avg/minggu)</div><div class="value">${Math.round(acwr.chronicWeeklyAvg)}</div></div>
      <div class="stat-card"><div class="label">Load Trend</div><div class="value" style="font-size:15px;">${trend.status}</div></div>
    </div>
    <p class="helper" style="margin:-8px 0 16px;font-style:italic;">ACWR adalah metric monitoring beban latihan, bukan alat diagnosis cedera. Interpretasikan bersama riwayat latihan, recovery, dan penilaian pelatih.</p>

    <div class="chart-card">
      <h3>Planned vs Actual — Minggu ${wk}</h3>
      <div class="info-grid">
        <div class="info-item"><div class="k">Planned Load</div><div class="v">${planned.load!=null?planned.load+' AU':'-'}</div></div>
        <div class="info-item"><div class="k">Actual Load</div><div class="v">${Math.round(actual.load)} AU</div></div>
        <div class="info-item"><div class="k">Planned Volume</div><div class="v">${planned.volume!=null?planned.volume+' kg':'-'}</div></div>
        <div class="info-item"><div class="k">Actual Volume</div><div class="v">${Math.round(actual.volume)} kg</div></div>
        <div class="info-item"><div class="k">Planned Intensity</div><div class="v">${planned.intensity!=null?planned.intensity+'%':'-'}</div></div>
        <div class="info-item"><div class="k">Actual Intensity</div><div class="v">${actual.avgIntensity!=null?actual.avgIntensity+'%':'-'}</div></div>
        <div class="info-item"><div class="k">Planned RPE</div><div class="v">${planned.rpe!=null?planned.rpe:'-'}</div></div>
        <div class="info-item"><div class="k">Actual RPE</div><div class="v">${actualRPE!=null?actualRPE:'-'}</div></div>
      </div>
      ${planned.load ? `<p class="helper" style="margin-top:8px;">Difference Load: <b style="color:${actual.load>planned.load?'var(--poor)':'var(--elite)'}">${actual.load>=planned.load?'+':''}${Math.round((actual.load-planned.load)/planned.load*100)}%</b></p>` : ""}
      ${loadWarn ? `<div class="warn-box sev-high"><span class="wicon">🔴</span><span>Actual workload is above planned workload. Review volume, intensity and recovery.</span></div>` : ""}
    </div>

    <div class="section-tabs">
      <button class="${state.mpAnalysisGrain==='session'?'active':''}" onclick="setMpAnalysisGrain('session')">Session</button>
      <button class="${state.mpAnalysisGrain==='week'?'active':''}" onclick="setMpAnalysisGrain('week')">Week</button>
      <button class="${state.mpAnalysisGrain==='phase'?'active':''}" onclick="setMpAnalysisGrain('phase')">Phase</button>
      <button class="${state.mpAnalysisGrain==='plan'?'active':''}" onclick="setMpAnalysisGrain('plan')">Master Plan</button>
    </div>

    <div class="chart-card"><h3>Training Load — Planned vs Actual</h3>${rows.length===0?`<div class="chart-empty">Belum ada data training load aktual.</div>`:`<canvas id="chart-pva-load" height="180"></canvas>`}</div>
    <div class="chart-card"><h3>Volume — Planned vs Actual</h3>${rows.length===0?`<div class="chart-empty">Belum ada data training load aktual.</div>`:`<canvas id="chart-pva-volume" height="180"></canvas>`}</div>
    <div class="chart-card"><h3>Intensity — Planned vs Actual</h3>${rows.length===0?`<div class="chart-empty">Belum ada data training load aktual.</div>`:`<canvas id="chart-pva-intensity" height="180"></canvas>`}</div>
    <div class="chart-card"><h3>RPE — Planned vs Actual</h3>${rows.length===0?`<div class="chart-empty">Belum ada data training load aktual.</div>`:`<canvas id="chart-pva-rpe" height="180"></canvas>`}</div>
  `;
}

// Menyusun {labels, planned[], actual[]} untuk satu metric pada satu level agregasi (Session/Week/Phase/Master Plan)
function buildPvaSeries(mp, rows, grain, metric){
  const totalWeeks = Number(mp.durationWeeks)||0;
  const weeks = Array.from({length: totalWeeks}, (_,i)=>i+1);
  const perWeek = weeks.map(w=>{
    const p = weekPlannedStats(mp, w);
    const a = weekActualStats(rows, mp, w);
    let planned, actual;
    if(metric==="load"){ planned=p.load; actual=a.load; }
    else if(metric==="volume"){ planned=p.volume; actual=a.volume; }
    else if(metric==="intensity"){ planned=p.intensity; actual=a.avgIntensity; }
    else { planned=p.rpe; actual = weekActualRPEFromPlans(mp,w) != null ? weekActualRPEFromPlans(mp,w) : a.avgRpe; }
    return { week:w, planned, actual };
  });

  if(grain==="week"){
    return { labels: weeks.map(w=>"M"+w), planned: perWeek.map(x=>x.planned||0), actual: perWeek.map(x=>x.actual||0) };
  }
  if(grain==="phase"){
    const phases = [...mp.phases].sort((a,b)=>a.weekStart-b.weekStart);
    const labels = [], planned = [], actual = [];
    const isAvgMetric = metric==="intensity" || metric==="rpe";
    phases.forEach(ph=>{
      const ws = perWeek.filter(x=>x.week>=ph.weekStart && x.week<=ph.weekEnd);
      labels.push(ph.label);
      if(isAvgMetric){
        const pv = ws.map(x=>x.planned).filter(v=>v!=null);
        const av = ws.map(x=>x.actual).filter(v=>v!=null);
        planned.push(pv.length ? Math.round(pv.reduce((a,b)=>a+b,0)/pv.length) : 0);
        actual.push(av.length ? Math.round(av.reduce((a,b)=>a+b,0)/av.length) : 0);
      } else {
        planned.push(Math.round(ws.reduce((s,x)=>s+(x.planned||0),0)));
        actual.push(Math.round(ws.reduce((s,x)=>s+(x.actual||0),0)));
      }
    });
    return { labels, planned, actual };
  }
  if(grain==="plan"){
    const isAvgMetric = metric==="intensity" || metric==="rpe";
    if(isAvgMetric){
      const pv = perWeek.map(x=>x.planned).filter(v=>v!=null);
      const av = perWeek.map(x=>x.actual).filter(v=>v!=null);
      return { labels:[mp.name || mp.athleteName || "Master Plan"],
        planned:[pv.length ? Math.round(pv.reduce((a,b)=>a+b,0)/pv.length) : 0],
        actual:[av.length ? Math.round(av.reduce((a,b)=>a+b,0)/av.length) : 0] };
    }
    return { labels:[mp.name || mp.athleteName || "Master Plan"],
      planned:[Math.round(perWeek.reduce((s,x)=>s+(x.planned||0),0))],
      actual:[Math.round(perWeek.reduce((s,x)=>s+(x.actual||0),0))] };
  }
  // grain === "session": bandingkan sesi aktual terbaru dengan rencana sesi harian di tanggal yang sama (jika ada)
  const sessRows = rows.slice(-14);
  const labels = sessRows.map(r=>new Date(r.date).toLocaleDateString("id-ID",{day:"2-digit",month:"short"}));
  const planned = sessRows.map(r=>{
    const dateStr = new Date(r.date).toISOString().slice(0,10);
    const plan = mp.dailyPlans && mp.dailyPlans[dateStr];
    if(!plan || plan.isRestDay) return 0;
    const rpes = plan.blocks.flatMap(b=>b.exercises).map(e=>Number(e.rpeTarget)).filter(v=>v>0);
    const estRpe = rpes.length ? rpes.reduce((a,b)=>a+b,0)/rpes.length : 0;
    if(metric==="load") return Math.round((plan.actualDuration || 0) * estRpe) || 0;
    if(metric==="rpe") return rpes.length ? Math.round(estRpe*10)/10 : 0;
    return 0; // volume/intensity planned tidak dipecah per-sesi, hanya per-minggu
  });
  const actual = sessRows.map(r=>{
    if(metric==="load") return Math.round(r.load||0);
    if(metric==="volume") return Math.round(r.volumeLoad||0);
    if(metric==="rpe") return r.rpe||0;
    const pctVals = (r.strengthData||[]).map(x=>x.pct1rm).filter(v=>v!=null);
    return pctVals.length ? Math.round(pctVals.reduce((a,b)=>a+b,0)/pctVals.length) : Math.round((r.rpe||0)*10);
  });
  return { labels, planned, actual };
}

function drawPvaCharts(){
  const mp = loadMasterplans().find(m=>m.id===state.mpId); if(!mp) return;
  const rows = loadDB(DB_KEYS.loads).filter(x=>x.athleteId===mp.athleteId).sort((a,b)=>a.date-b.date);
  if(rows.length===0) return;
  const grain = state.mpAnalysisGrain || "week";
  [
    ["load","chart-pva-load"],
    ["volume","chart-pva-volume"],
    ["intensity","chart-pva-intensity"],
    ["rpe","chart-pva-rpe"]
  ].forEach(([metric, canvasId])=>{
    destroyChart(canvasId);
    const canvas = document.getElementById(canvasId); if(!canvas) return;
    const { labels, planned, actual } = buildPvaSeries(mp, rows, grain, metric);
    chartInstances[canvasId] = new Chart(canvas, {
      type:"bar",
      data:{ labels, datasets:[
        { label:"Planned", data:planned, backgroundColor:"#9FD9D5" },
        { label:"Actual", data:actual, backgroundColor:"#20B2AA" }
      ]},
      options:{ responsive:true, plugins:{legend:{display:true, labels:{font:{size:10}}}}, scales:{ y:{ticks:{font:{size:10}}}, x:{ticks:{font:{size:10}}} } }
    });
  });
}

/* ---------------- AUTENTIKASI ---------------- */
let authState = { mode:"login", loading:false, msg:"", msgType:"" };

function renderAuthScreen(){
  const root = document.getElementById("app");
  const configMissing = !sb;
  root.innerHTML = `
    <div id="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="icon-192.png" alt="Fight With Jo"/>
          <h1>FIGHT WITH JO</h1>
          <p>Performance App</p>
        </div>
        ${configMissing ? `
          <div class="config-warning">
            Aplikasi belum terhubung ke Supabase. Buka file <b>index.html</b>, isi
            <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> di bagian atas
            script dengan kredensial project Supabase-mu.
          </div>
        ` : `
          <div class="auth-tabs">
            <button class="${authState.mode==='login'?'active':''}" onclick="authState.mode='login'; authState.msg=''; renderAuthScreen();">Masuk</button>
            <button class="${authState.mode==='signup'?'active':''}" onclick="authState.mode='signup'; authState.msg=''; renderAuthScreen();">Daftar</button>
          </div>
          ${authState.mode==='signup' ? `<div class="field"><label>Nama lengkap</label><input id="auth-name" placeholder="Nama kamu"/></div>` : ""}
          <div class="field"><label>Email</label><input id="auth-email" type="email" placeholder="coach@fightwithjo.com"/></div>
          <div class="field"><label>Password</label><input id="auth-password" type="password" placeholder="Minimal 6 karakter"/></div>
          ${authState.msg ? `<div class="auth-msg ${authState.msgType}">${authState.msg}</div>` : `<div class="auth-msg"></div>`}
          <button class="btn" id="auth-submit-btn" onclick="handleAuthSubmit()">${authState.mode==='login' ? 'Masuk' : 'Buat Akun'}</button>
          ${authState.mode==='signup' ? `<div class="helper" style="text-align:center;margin-top:12px;">Akun baru dimulai dengan role "viewer". Admin pertama harus dipromosikan manual lewat Supabase Table Editor.</div>` : ""}
        `}
      </div>
    </div>
  `;
}

async function handleAuthSubmit(){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const btn = document.getElementById("auth-submit-btn");
  if(!email || !password){ authState.msg = "Isi email dan password."; authState.msgType = "error"; renderAuthScreen(); return; }
  btn.disabled = true; btn.textContent = "Memproses...";

  if(authState.mode === "signup"){
    const fullName = document.getElementById("auth-name").value.trim();
    const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name: fullName } } });
    if(error){ authState.msg = error.message; authState.msgType = "error"; renderAuthScreen(); return; }
    authState.msg = "Akun dibuat. Kamu bisa langsung masuk.";
    authState.msgType = "ok"; authState.mode = "login"; renderAuthScreen();
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ authState.msg = error.message; authState.msgType = "error"; renderAuthScreen(); return; }
    await bootAppAfterLogin();
  }
}

async function handleLogout(){
  if(_realtimeChannel){ try{ sb.removeChannel(_realtimeChannel); }catch(e){} _realtimeChannel = null; }
  await sb.auth.signOut();
  cache = { athletes:[], tests:[], assessments:[], injuries:[], testCategories:[], bodyParts:[], profile:null, readiness:[], loads:[], goals:[], batteries:[], batterySessions:[], rehabLogs:[], asymmetry:[], notes:[], competitions:[], competitionResults:[], masterplans:[], scoringProfiles:[], scoringRanges:[] };
  renderAuthScreen();
}

async function bootAppAfterLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ renderAuthScreen(); return; }
  const { data: profile } = await sb.from("profiles").select("*").eq("id", user.id).single();
  cache.profile = profile;
  await refreshAll();
  render();
  flushSyncQueue(true); // Refresh Sync: proses ulang perubahan offline yang sempat tertunda saat login
  startRealtimeSync();  // bagian 15: Supabase Realtime untuk Master Plan & Training Session
}

/* ---------------- SUPABASE REALTIME (bagian 15) ----------------
   Kalau tersedia, dengarkan perubahan langsung dari Supabase (device lain / coach lain)
   supaya Master Plan & Training Load ter-update otomatis tanpa perlu refresh manual. */
let _realtimeChannel = null;
function startRealtimeSync(){
  if(!sb || _realtimeChannel) return;
  try{
    _realtimeChannel = sb.channel("fwj-cross-device-sync")
      .on("postgres_changes", { event:"*", schema:"public", table:"training_masterplans" }, ()=>{
        refreshMasterplans().then(render);
      })
      .on("postgres_changes", { event:"*", schema:"public", table:"training_sessions" }, ()=>{
        refreshTrainingLoad().then(render);
      })
      .subscribe();
  }catch(e){ console.warn("Realtime tidak aktif (opsional):", e); }
}

async function initApp(){
  if(!sb){ renderAuthScreen(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await bootAppAfterLogin(); }
  else { renderAuthScreen(); }
}

initApp();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
