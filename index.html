/* ==========================================================
   MASTER PLAN — AI Sports Periodization Engine
   Disimpan lokal (localStorage) di browser masing-masing pelatih.
========================================================== */
const MP_KEY = "fwj_masterplans_v1";
function loadMasterplans(){ try{ return JSON.parse(localStorage.getItem(MP_KEY)) || []; }catch(e){ return []; } }
function saveMasterplans(list){ localStorage.setItem(MP_KEY, JSON.stringify(list)); }
function genId(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

const GOAL_OPTIONS = [
  "General Fitness","Hypertrophy","Maximal Strength","Strength Endurance","Power","Speed",
  "Acceleration","Agility / Change of Direction","Aerobic Endurance","Anaerobic Capacity",
  "Repeated Sprint Ability","Mobility","Injury Prevention","Sport-specific Performance","Competition Peak"
];
const LEVEL_OPTIONS = ["Pemula","Intermediate","Advanced","Elite"];

const MODEL_LABEL = { traditional:"Traditional / American", block:"Block Periodization", nonlinear:"Non-linear / Undulating" };
const MODEL_ICON = { traditional:"🟦", block:"🟩", nonlinear:"🟧" };

const TRADITIONAL_PHASES = [
  {label:"General Preparation", pct:0.20, volume:"High", intensity:"Low", specificity:"Low", focus:"Adaptasi umum & work capacity"},
  {label:"Hypertrophy / Anatomical Adaptation", pct:0.15, volume:"High", intensity:"Moderate", specificity:"Low", focus:"Massa otot & fondasi kekuatan"},
  {label:"Strength", pct:0.20, volume:"Moderate", intensity:"High", specificity:"Moderate", focus:"Maximal strength"},
  {label:"Power", pct:0.15, volume:"Moderate", intensity:"High", specificity:"High", focus:"Explosive strength / power"},
  {label:"Peaking", pct:0.10, volume:"Low", intensity:"High", specificity:"High", focus:"Konsolidasi performa puncak"},
  {label:"Competition", pct:0.10, volume:"Low", intensity:"High", specificity:"High", focus:"Kompetisi utama"},
  {label:"Transition", pct:0.10, volume:"Low", intensity:"Low", specificity:"Low", focus:"Recovery & regenerasi"}
];
const BLOCK_PHASES = [
  {label:"Accumulation", pct:0.40, volume:"High", intensity:"Moderate", specificity:"Low", focus:"Hypertrophy / General Strength / Aerobic base / Work capacity"},
  {label:"Transmutation", pct:0.35, volume:"Moderate", intensity:"High", specificity:"Moderate", focus:"Maximal strength / Speed-strength / Power / Anaerobic capacity"},
  {label:"Realization", pct:0.25, volume:"Low", intensity:"High", specificity:"High", focus:"Competition specificity, peak performance, taper"}
];

function levelWeight(level){ return {"Pemula":1,"Intermediate":2,"Advanced":3,"Elite":4}[level] || 1; }

function recommendModel(input){
  const reasons = [];
  const weeks = Number(input.durationWeeks) || 0;
  const trainingAge = Number(input.trainingAge) || 0;
  const lvl = levelWeight(input.level);
  const needsSimultaneous = input.secondaryGoal && input.maintenanceGoal && input.secondaryGoal !== input.maintenanceGoal;
  let model, confidence = 65;

  if(input.level === "Pemula" || weeks <= 8){
    model = "traditional"; confidence = 78;
    reasons.push("Level pemula atau durasi program pendek paling cocok dengan progresi linear yang jelas tahap demi tahap.");
    reasons.push("Atlet membutuhkan adaptasi anatomis dasar sebelum menangani kompleksitas model lain.");
  } else if(needsSimultaneous && lvl >= 3){
    model = "nonlinear"; confidence = 74;
    reasons.push("Atlet perlu mempertahankan beberapa kualitas fisik (secondary & maintenance) secara simultan.");
    reasons.push("Level Advanced/Elite mampu mentoleransi variasi stimulus harian/mingguan tanpa kehilangan fokus adaptasi.");
  } else if(trainingAge >= 3 && lvl >= 2){
    model = "block"; confidence = 80;
    reasons.push("Training age memadai untuk fokus terkonsentrasi per blok (accumulation → transmutation → realization).");
    reasons.push("Kalender program cukup panjang untuk menjalankan sekuens blok tanpa mengorbankan kualitas lain (maintenance dose).");
  } else {
    model = "traditional"; confidence = 60;
    reasons.push("Kombinasi level dan training age saat ini paling sesuai dengan pendekatan progresif standar.");
  }
  reasons.push(`Primary goal "${input.primaryGoal}" mendukung struktur fase model ini.`);
  if(confidence < 70) reasons.push("Hybrid periodization mungkin lebih sesuai — pertimbangkan evaluasi ulang di tengah program.");
  return {model, reasons, confidence};
}

function buildPhaseWeeks(phaseTemplate, totalWeeks){
  const out = []; let cursor = 1;
  phaseTemplate.forEach((p, idx) => {
    let len = Math.max(1, Math.round(p.pct * totalWeeks));
    if(idx === phaseTemplate.length - 1) len = totalWeeks - cursor + 1;
    if(len < 1) len = 1;
    const weekStart = cursor, weekEnd = Math.min(totalWeeks, cursor + len - 1);
    out.push({ ...p, weekStart, weekEnd });
    cursor = weekEnd + 1;
  });
  return out.filter(p => p.weekStart <= totalWeeks);
}

function buildMesocycles(phases, model){
  const meso = [];
  phases.forEach((ph, i) => {
    const totalLen = ph.weekEnd - ph.weekStart + 1;
    let cursor = ph.weekStart, blockNum = 1;
    while(cursor <= ph.weekEnd){
      const len = Math.min(4, ph.weekEnd - cursor + 1);
      const wEnd = cursor + len - 1;
      const isDeload = len >= 4;
      meso.push({
        id: genId("meso"), phaseLabel: ph.label, blockLabel: `${ph.label}${totalLen>4 ? " — Blok " + blockNum : ""}`,
        weekStart: cursor, weekEnd: wEnd, volume: ph.volume, intensity: ph.intensity,
        specificity: ph.specificity, focus: ph.focus, deload: isDeload, model
      });
      cursor = wEnd + 1; blockNum++;
    }
  });
  return meso;
}

function generateMasterplanData(input){
  const durationWeeks = Number(input.durationWeeks);
  let resolvedModel = input.model, autoReasons = [], confidence = null;
  if(input.model === "auto"){
    const rec = recommendModel(input);
    resolvedModel = rec.model; autoReasons = rec.reasons; confidence = rec.confidence;
  } else {
    autoReasons = [`Model dipilih manual oleh pelatih: ${MODEL_LABEL[input.model]}.`];
  }

  let phases;
  if(resolvedModel === "traditional") phases = buildPhaseWeeks(TRADITIONAL_PHASES, durationWeeks);
  else if(resolvedModel === "block") phases = buildPhaseWeeks(BLOCK_PHASES, durationWeeks);
  else phases = buildPhaseWeeks([
    {label:"Undulating Cycle", pct:1, volume:"Bergelombang", intensity:"Bergelombang", specificity:"Meningkat", focus:"Hypertrophy ↔ Strength ↔ Power ↔ Speed (rotasi harian/mingguan)"}
  ], durationWeeks);

  const mesocycles = buildMesocycles(phases, resolvedModel);

  return {
    id: genId("mp"),
    athleteId: input.athleteId, athleteName: input.athleteName,
    sport: input.sport, level: input.level, trainingAge: input.trainingAge,
    startDate: input.startDate, durationWeeks,
    trainingDaysPerWeek: input.trainingDaysPerWeek,
    primaryGoal: input.primaryGoal, secondaryGoal: input.secondaryGoal, maintenanceGoal: input.maintenanceGoal,
    competitionName: input.competitionName, competitionDate: input.competitionDate,
    modelInput: input.model, resolvedModel, confidence, reasons: autoReasons,
    phases, mesocycles, weeklyLogs: [],
    createdAt: Date.now()
  };
}

function currentWeekOf(mp){
  const start = new Date(mp.startDate).getTime();
  if(isNaN(start)) return 1;
  const diffDays = Math.floor((Date.now() - start) / 86400000);
  const wk = Math.floor(diffDays / 7) + 1;
  return Math.min(mp.durationWeeks, Math.max(1, wk));
}
function mesoForWeek(mp, week){ return mp.mesocycles.find(m => week >= m.weekStart && week <= m.weekEnd); }
function phaseForWeek(mp, week){ return mp.phases.find(p => week >= p.weekStart && week <= p.weekEnd); }

  showToast("Master Plan dihapus");
}

/* ---------------- MASTER PLAN: DETAIL ---------------- */

  const mp = loadMasterplans().find(m=>m.id===state.mpId);
  if(!mp){ state.mpId=null; return viewMasterplanList(); }
  const wk = currentWeekOf(mp);

  return `
    <div class="back-row" onclick="backToMasterplanList()"><span class="arrow">‹</span><span class="label">Semua Master Plan</span></div>
    <div class="profile-head">
      <div class="mp-icon" style="width:56px;height:56px;font-size:24px;">${MODEL_ICON[mp.resolvedModel]}</div>
      <div>
        <h2>${mp.athleteName}</h2>
        <p>${mp.sport} · ${mp.level} · ${MODEL_LABEL[mp.resolvedModel]}</p>
      </div>
    </div>
    <div class="info-grid">
      <div class="info-item"><div class="k">Program</div><div class="v">${mp.durationWeeks} minggu</div></div>
      <div class="info-item"><div class="k">Minggu Berjalan</div><div class="v">${wk} / ${mp.durationWeeks}</div></div>
      <div class="info-item"><div class="k">Hari Latihan</div><div class="v">${mp.trainingDaysPerWeek}x / minggu</div></div>
      <div class="info-item"><div class="k">Kompetisi Utama</div><div class="v">${mp.competitionName || "-"}</div></div>
    </div>

    <div class="section-tabs">
      <button class="${state.mpSection==='overview'?'active':''}" onclick="setMpSection('overview')">Ringkasan</button>
      <button class="${state.mpSection==='macrocycle'?'active':''}" onclick="setMpSection('macrocycle')">Macrocycle</button>
      <button class="${state.mpSection==='mesocycle'?'active':''}" onclick="setMpSection('mesocycle')">Mesocycle</button>
      <button class="${state.mpSection==='monitoring'?'active':''}" onclick="setMpSection('monitoring')">Monitoring</button>
    </div>

    <div id="mp-section-body">
      ${state.mpSection==='overview' ? mpOverviewSection(mp, wk) : ""}
      ${state.mpSection==='macrocycle' ? mpMacrocycleSection(mp, wk) : ""}
      ${state.mpSection==='mesocycle' ? mpMesocycleSection(mp, wk) : ""}
      ${state.mpSection==='monitoring' ? mpMonitoringSection(mp, wk) : ""}
    </div>
    <span class="delete-link" onclick="deleteMasterplan('${mp.id}')">🗑 Hapus Master Plan</span>

}

function mpOverviewSection(mp, wk){
  const phase = phaseForWeek(mp, wk);
  return `
    <div class="goal-hier">
      <div class="goal-row"><span class="goal-tag primary">Primary</span><span class="goal-val">${mp.primaryGoal || "-"}</span></div>
      <div class="goal-row"><span class="goal-tag secondary">Secondary</span><span class="goal-val">${mp.secondaryGoal || "-"}</span></div>
      <div class="goal-row"><span class="goal-tag maintenance">Maintenance</span><span class="goal-val">${mp.maintenanceGoal || "-"}</span></div>
    </div>

    <div class="rationale-box">
      <p>Periodization Rationale</p>
      <ul>${mp.reasons.map(r=>`<li>${r}</li>`).join("")}</ul>
      ${mp.confidence!==null ? `<div class="helper" style="margin-top:8px;">Confidence rekomendasi AI: <b>${mp.confidence}%</b></div>` : ""}
    </div>

    <div class="chart-card">
      <h3>Fase Saat Ini</h3>
      <p style="margin:0 0 4px;font-weight:700;font-size:14px;">${phase ? phase.label : "-"}</p>
      <p style="margin:0;font-size:12px;color:var(--muted);">${phase ? phase.focus : ""}</p>
      ${phase ? `<div class="mp-progress" style="margin-top:10px;"><div class="fill" style="width:${Math.round((wk/mp.durationWeeks)*100)}%"></div></div>` : ""}
    </div>

    <div class="info-grid">
      <div class="info-item"><div class="k">Kompetisi</div><div class="v">${mp.competitionName || "Belum diisi"}</div></div>
      <div class="info-item"><div class="k">Tanggal Kompetisi</div><div class="v">${mp.competitionDate ? new Date(mp.competitionDate).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}) : "DATA REQUIRED"}</div></div>
    </div>
  `;
}

function trendBars(level3){
  // level3: "Low" | "Moderate" | "High" | lainnya (non-terukur -> tampil abu-abu semua nyala sebagian)
  const map = {"Low":1,"Moderate":2,"High":3};
  const n = map[level3] || 2;
  let segs = "";
  for(let i=1;i<=3;i++) segs += `<div class="seg ${i<=n?'on':''}" style="flex:1;"></div>`;
  return `<div class="bar-track">${segs}</div>`;
}

function mpMacrocycleSection(mp, wk){
  return `
    <table class="phase-table">
      <thead><tr><th>Phase</th><th>Minggu</th><th>Fokus</th><th>Vol</th><th>Int</th><th>Spec</th></tr></thead>
      <tbody>
        ${mp.phases.map(p => `
          <tr class="${wk>=p.weekStart && wk<=p.weekEnd ? 'current-row':''}">
            <td>${p.label}</td>
            <td>${p.weekStart}–${p.weekEnd}</td>
            <td>${p.focus}</td>
            <td>${p.volume}</td>
            <td>${p.intensity}</td>
            <td>${p.specificity}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>

    <div class="trend-block">
      <h3>Volume Trend</h3>
      ${mp.phases.map(p=>`<div class="trend-row"><span class="lbl">${p.label.split(" ")[0]}</span>${trendBars(p.volume)}</div>`).join("")}
    </div>
    <div class="trend-block">
      <h3>Intensity Trend</h3>
      ${mp.phases.map(p=>`<div class="trend-row"><span class="lbl">${p.label.split(" ")[0]}</span>${trendBars(p.intensity)}</div>`).join("")}
    </div>
    <div class="trend-block">
      <h3>Specificity Trend</h3>
      ${mp.phases.map(p=>`<div class="trend-row"><span class="lbl">${p.label.split(" ")[0]}</span>${trendBars(p.specificity)}</div>`).join("")}
    </div>
  `;
}

function mpMesocycleSection(mp, wk){
  return `
    <div class="card-list">
      ${mp.mesocycles.map((m,i) => `
        <div class="meso-card ${m.deload ? '' : ''}" style="${wk>=m.weekStart && wk<=m.weekEnd ? 'box-shadow:0 0 0 2px var(--turquoise) inset;' : ''}">
          <div class="mtitle"><b>Mesocycle ${i+1} — ${m.blockLabel}</b><span>Minggu ${m.weekStart}–${m.weekEnd}</span></div>
          <p style="margin:0;font-size:12.5px;color:var(--muted);">${m.focus}</p>
          <div class="meso-tags">
            <span>Volume: ${m.volume}</span>
            <span>Intensity: ${m.intensity}</span>
            <span>Specificity: ${m.specificity}</span>
            ${m.weekEnd - m.weekStart + 1 >= 4 ? `<span>Deload: Minggu ${m.weekEnd}</span>` : ""}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function computeAdjustment(plannedRPE, actualRPE){
  const diff = actualRPE - plannedRPE;
  if(diff >= 2) return {status:"Fatigue Tinggi", color:"var(--poor)", rec:"Kurangi volume sesi berikutnya sekitar 15–20%. Tambahkan waktu recovery dan evaluasi tidur/soreness sebelum melanjutkan progresi."};
  if(diff === 1) return {status:"Fatigue Sedang", color:"var(--average)", rec:"Pertahankan intensity, kurangi volume accessory ±10%. Pantau recovery dalam 24 jam ke depan."};
  if(diff === 0) return {status:"Sesuai Rencana", color:"var(--good)", rec:"Tidak perlu perubahan besar. Lanjutkan progresi sesuai rencana mesocycle."};
  return {status:"Di Bawah Target", color:"var(--elite)", rec:"Performa/kesiapan lebih baik dari prediksi. Pertimbangkan sedikit penambahan beban atau volume pada sesi berikutnya."};
}

function mpMonitoringSection(mp, wk){
  const currentMeso = mesoForWeek(mp, wk);
  const logs = [...mp.weeklyLogs].sort((a,b)=>b.week-a.week);
  return `
    <button class="btn ghost" style="margin-bottom:14px;" onclick="openModal('addWeeklyLog', {mpId:'${mp.id}', week:${wk}})">+ Input Monitoring Minggu ${wk}</button>
    ${currentMeso ? `<div class="helper" style="margin-top:-8px;">Mesocycle aktif: <b>${currentMeso.blockLabel}</b> (Volume ${currentMeso.volume}, Intensity ${currentMeso.intensity})</div>` : ""}
    ${logs.length === 0 ? `<div class="chart-empty">Belum ada data monitoring. Input RPE terencana vs aktual tiap minggu untuk mendapat rekomendasi penyesuaian otomatis.</div>` : `
      <div class="card-list" style="margin-top:14px;">
        ${logs.map(l => {
          const adj = computeAdjustment(l.plannedRPE, l.actualRPE);
          return `
          <div class="log-item">
            <div class="lhead"><b>Minggu ${l.week}</b><span class="status-pill" style="background:${adj.color}">${adj.status}</span></div>
            <div class="lrow"><span>Planned RPE: <b style="color:var(--text)">${l.plannedRPE}</b></span><span>Actual RPE: <b style="color:var(--text)">${l.actualRPE}</b></span></div>
            ${l.note ? `<div class="lrow"><span>Catatan: ${l.note}</span></div>` : ""}
            <div class="lrec"><b>Rekomendasi:</b> ${adj.rec}</div>
          </div>`;
        }).join("")}
      </div>
    `}
  `;
}

function modalAddWeeklyLog(payload){
  return `
    <div class="modal-head"><h3>Monitoring Minggu ${payload.week}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="field-row">
      <div class="field"><label>Planned RPE</label><input id="wl-planned" type="number" min="1" max="10" placeholder="7"/></div>
      <div class="field"><label>Actual RPE</label><input id="wl-actual" type="number" min="1" max="10" placeholder="8"/></div>
    </div>
    <div class="field"><label>Catatan (opsional)</label><textarea id="wl-note" rows="3" placeholder="Kondisi tidur, soreness, adherence, dll."></textarea></div>
    <div id="wl-err" class="err" style="display:none;"></div>
    <button class="btn" onclick="submitWeeklyLog('${payload.mpId}', ${payload.week})">Simpan & Hitung Rekomendasi</button>
  `;
}
function submitWeeklyLog(mpId, week){
  const planned = Number(document.getElementById("wl-planned").value);
  const actual = Number(document.getElementById("wl-actual").value);
  const note = document.getElementById("wl-note").value.trim();
  const errBox = document.getElementById("wl-err");
  if(!planned || !actual){ errBox.style.display="block"; errBox.textContent="Isi Planned RPE dan Actual RPE."; return; }
  const list = loadMasterplans();
  const mp = list.find(m=>m.id===mpId);
  if(!mp){ closeModal(); return; }
  mp.weeklyLogs = mp.weeklyLogs.filter(l=>l.week!==week);
  mp.weeklyLogs.push({ week, plannedRPE:planned, actualRPE:actual, note, loggedAt: Date.now() });
  saveMasterplans(list);
  closeModal();
  state.mpSection = "monitoring";
  render();
  showToast("Monitoring tersimpan");
}

  overlay.onclick = (e) => { if(e.target===overlay) closeModal(); };
  const modal = document.createElement("div"); modal.className = "modal"; modal.onclick = (e)=>e.stopPropagation();
  if(state.modal.name==="addTest") modal.innerHTML = modalAddTest();
  if(state.modal.name==="addAthlete") modal.innerHTML = modalAddAthlete();
  if(state.modal.name==="addAssessment") modal.innerHTML = modalAddAssessment(state.modal.payload);
  if(state.modal.name==="addReadiness") modal.innerHTML = modalAddReadiness(state.modal.payload);
  if(state.modal.name==="addTrainingSession") modal.innerHTML = modalAddTrainingSession(state.modal.payload);
  if(state.modal.name==="addGoal") modal.innerHTML = modalAddGoal(state.modal.payload);
  if(state.modal.name==="createBattery") modal.innerHTML = modalCreateBattery();
  if(state.modal.name==="runBattery") modal.innerHTML = modalRunBattery(state.modal.payload);
  if(state.modal.name==="injuryDetail") modal.innerHTML = modalInjuryDetail(state.modal.payload);
  if(state.modal.name==="addRehabLog") modal.innerHTML = modalAddRehabLog(state.modal.payload);
  if(state.modal.name==="addAsymmetry") modal.innerHTML = modalAddAsymmetry(state.modal.payload);
  if(state.modal.name==="addNote") modal.innerHTML = modalAddNote(state.modal.payload);
  if(state.modal.name==="addCompetition") modal.innerHTML = modalAddCompetition();
  if(state.modal.name==="addParticipant") modal.innerHTML = modalAddParticipant(state.modal.payload);
  if(state.modal.name==="importAthletes") modal.innerHTML = modalImportAthletes();
  if(state.modal.name==="addScoringProfile") modal.innerHTML = modalAddScoringProfile(state.modal.payload);
  if(state.modal.name==="importScoringStandards") modal.innerHTML = modalImportScoringStandards();
  if(state.modal.name==="backup") modal.innerHTML = modalBackup();
  if(state.modal.name==="addMasterplan") modal.innerHTML = modalAddMasterplan();
  if(state.modal.name==="addWeeklyLog") modal.innerHTML = modalAddWeeklyLog(state.modal.payload);
  overlay.appendChild(modal);
  document.getElementById("app").appendChild(overlay);
}

/* ---------------- AUTENTIKASI ---------------- */
let authState = { mode:"login", loading:false, msg:"", msgType:"" };

function renderAuthScreen(){
  const root = document.getElementById("app");
  const configMissing = !sb;
  root.innerHTML = `
    <div id="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="icon-192.png" alt="Fight With Jo"/>
          <h1>FIGHT WITH JO</h1>
          <p>Performance App</p>
        </div>
        ${configMissing ? `
          <div class="config-warning">
            Aplikasi belum terhubung ke Supabase. Buka file <b>index.html</b>, isi
            <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> di bagian atas
            script dengan kredensial project Supabase-mu.
          </div>
        ` : `
          <div class="auth-tabs">
            <button class="${authState.mode==='login'?'active':''}" onclick="authState.mode='login'; authState.msg=''; renderAuthScreen();">Masuk</button>
            <button class="${authState.mode==='signup'?'active':''}" onclick="authState.mode='signup'; authState.msg=''; renderAuthScreen();">Daftar</button>
          </div>
          ${authState.mode==='signup' ? `<div class="field"><label>Nama lengkap</label><input id="auth-name" placeholder="Nama kamu"/></div>` : ""}
          <div class="field"><label>Email</label><input id="auth-email" type="email" placeholder="coach@fightwithjo.com"/></div>
          <div class="field"><label>Password</label><input id="auth-password" type="password" placeholder="Minimal 6 karakter"/></div>
          ${authState.msg ? `<div class="auth-msg ${authState.msgType}">${authState.msg}</div>` : `<div class="auth-msg"></div>`}
          <button class="btn" id="auth-submit-btn" onclick="handleAuthSubmit()">${authState.mode==='login' ? 'Masuk' : 'Buat Akun'}</button>
          ${authState.mode==='signup' ? `<div class="helper" style="text-align:center;margin-top:12px;">Akun baru dimulai dengan role "viewer". Admin pertama harus dipromosikan manual lewat Supabase Table Editor.</div>` : ""}
        `}
      </div>
    </div>
  `;
}

async function handleAuthSubmit(){
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const btn = document.getElementById("auth-submit-btn");
  if(!email || !password){ authState.msg = "Isi email dan password."; authState.msgType = "error"; renderAuthScreen(); return; }
  btn.disabled = true; btn.textContent = "Memproses...";

  if(authState.mode === "signup"){
    const fullName = document.getElementById("auth-name").value.trim();
    const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name: fullName } } });
    if(error){ authState.msg = error.message; authState.msgType = "error"; renderAuthScreen(); return; }
    authState.msg = "Akun dibuat. Kamu bisa langsung masuk.";
    authState.msgType = "ok"; authState.mode = "login"; renderAuthScreen();
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ authState.msg = error.message; authState.msgType = "error"; renderAuthScreen(); return; }
    await bootAppAfterLogin();
  }
}

async function handleLogout(){
  await sb.auth.signOut();
  cache = { athletes:[], tests:[], assessments:[], injuries:[], testCategories:[], bodyParts:[], profile:null, readiness:[], loads:[], goals:[], batteries:[], batterySessions:[], rehabLogs:[], asymmetry:[], notes:[], competitions:[], competitionResults:[] };
  renderAuthScreen();
}

async function bootAppAfterLogin(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){ renderAuthScreen(); return; }
  const { data: profile } = await sb.from("profiles").select("*").eq("id", user.id).single();
  cache.profile = profile;
  await refreshAll();
  render();
}

async function initApp(){
  if(!sb){ renderAuthScreen(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await bootAppAfterLogin(); }
  else { renderAuthScreen(); }
}

initApp();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
